<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cart to Rocket</title>
<meta name="robots" content="noindex, nofollow">

<meta name="description" content="Launch a squeaky cart into forts of real toppling blocks, then upgrade it to rockets.">

<style>
@font-face {
font-family: 'Lilita One';
font-style: normal;
font-weight: 400;
font-display: block;
src: url('lilita-one.woff2') format('woff2');
}
:root {
--ink: #1E2235; --panel: #FFFDF7; --cta: #FF5A36; --cta-dark: #D63E1E; --secondary: #2EC4B6; --secondary-dark: #1F9488;
--disabled: #C9CED6; --gas: #3DDC84; --boost: #FF7A1A; --coin: #FFD23F; --coin-edge: #C98A00; --sun: #FFD84D;
--sky-top: #4FB6F5; --sky-horizon: #CFF1FF; --grass: #6CCB4E; --t2: #FF8A1F; --t3: #9AA5B1; --t4: #FFC93C;
--font: 'Lilita One', 'Trebuchet MS', sans-serif;
--fs-s: 14px; --fs-m: 18px; --fs-l: 26px; --fs-xl: 40px;
--line: 3px; --r: 16px;
--sat: 0px; --sar: 0px; --sab: 0px; --sal: 0px;
--lift: 0 6px 14px rgba(30, 34, 53, 0.22), 0 1px 2px rgba(30, 34, 53, 0.2);
--ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@supports (padding: env(safe-area-inset-top)) {
:root {
--sat: env(safe-area-inset-top); --sar: env(safe-area-inset-right);
--sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left);
}
}
* { box-sizing: border-box; }
html, body {
margin: 0; height: 100%; overflow: hidden; background: var(--sky-top); color: var(--ink);
font-family: var(--font); font-size: var(--fs-m); line-height: 1.2;
-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
overscroll-behavior: none;
}
::selection { background: var(--sun); color: var(--ink); }
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui .pass { pointer-events: none; }
#ui .pass [data-ui] { pointer-events: auto; }
[hidden] { display: none !important; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(var(--sky-top), var(--sky-horizon)); transition: opacity 0.4s var(--ease); z-index: 5; }
#boot h1 { margin: 0; font-weight: 400; font-size: var(--fs-xl); color: var(--panel); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; letter-spacing: 0.01em; }
.booted #boot { opacity: 0; pointer-events: none; }
.btn {
appearance: none; border: var(--line) solid var(--ink); border-radius: 14px; font: inherit; font-size: var(--fs-m);
min-height: 48px; min-width: 48px; padding: 0 20px; color: var(--ink); background: var(--panel); cursor: pointer;
display: inline-flex; align-items: center; justify-content: center; gap: 8px;
box-shadow: inset 0 -5px 0 rgba(30, 34, 53, 0.16), var(--lift);
transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease), background-color 0.15s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(30, 34, 53, 0.16), 0 2px 6px rgba(30, 34, 53, 0.2); }
.btn.cta { background: var(--cta); color: var(--panel); font-size: var(--fs-l); box-shadow: inset 0 -6px 0 var(--cta-dark), var(--lift); }
.btn.cta:active { box-shadow: inset 0 -2px 0 var(--cta-dark), 0 2px 6px rgba(30, 34, 53, 0.2); }
.btn.teal { background: var(--secondary); color: var(--panel); box-shadow: inset 0 -5px 0 var(--secondary-dark), var(--lift); }
.btn.icon { padding: 0; width: 48px; }
.btn svg { width: 26px; height: 26px; flex: none; }
.btn .txt-outline, .outline { -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 3px; }
.ico { stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.sticker { background: var(--panel); border: var(--line) solid var(--ink); border-radius: var(--r); box-shadow: var(--lift); }
.runhud .pause-btn { position: absolute; top: calc(10px + var(--sat)); right: calc(10px + var(--sar)); background: rgba(30, 34, 53, 0.55); color: var(--panel); border-color: var(--ink); box-shadow: none; }
.scrim { position: absolute; inset: 0; background: rgba(30, 34, 53, 0.45); display: grid; place-items: center; padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal)); animation: fade 0.2s var(--ease); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(18px) scale(0.96); opacity: 0; } }
.card { width: min(420px, 100%); min-width: min(360px, 100%); padding: 18px 20px 20px; animation: rise 0.35s var(--ease); max-height: 100%; overflow: auto; }
.card h2 { margin: 0 0 10px; font-weight: 400; font-size: var(--fs-l); }
.card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 2px dashed rgba(30, 34, 53, 0.14); font-size: var(--fs-m); opacity: 0; transform: translateX(-6px); transition: opacity 0.18s, transform 0.18s var(--ease); }
.card .row.on { opacity: 1; transform: none; }
.card .row .val { color: rgba(30, 34, 53, 0.62); margin-left: auto; padding-right: 10px; }
.card .row .c { display: inline-flex; align-items: center; gap: 4px; min-width: 64px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.coin-ico { width: 18px; height: 18px; flex: none; }
.card .total { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: var(--fs-l); }
.card .total .c { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.card .total .coin-ico { width: 26px; height: 26px; }
.card .near { margin: 12px 0 14px; font-size: var(--fs-m); color: var(--ink); background: rgba(46, 196, 182, 0.16); border-radius: 10px; padding: 8px 12px; }
.card .actions { display: flex; gap: 10px; }
.card .actions .btn { flex: 1; }
.ribbon { display: inline-block; background: var(--sun); border: var(--line) solid var(--ink); border-radius: 10px; padding: 2px 12px; font-size: var(--fs-m); transform: rotate(-3deg); margin-left: 8px; }
.card .why { font-size: var(--fs-s); color: rgba(30, 34, 53, 0.62); margin: -6px 0 8px; }
@media (max-height: 520px) and (min-aspect-ratio: 13/10) {
.card.tally { width: min(720px, 100%); display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr; column-gap: 22px; padding: 14px 18px 16px; }
.card.tally h2 { grid-column: 1 / -1; margin-bottom: 4px; }
.card.tally .lines { grid-column: 1; grid-row: 2; }
.card.tally .side { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: flex-end; }
.card.tally .row { padding: 3px 0; }
.card.tally .near { margin: 8px 0 10px; }
}
.garage { position: absolute; inset: 0; display: grid; grid-template-columns: 55fr 45fr; grid-template-rows: auto 1fr; padding: calc(8px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal)); gap: 8px 12px; pointer-events: none; }
.garage > * { pointer-events: auto; }
.g-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.balance { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px 4px 8px; min-height: 48px; font-size: var(--fs-l); font-variant-numeric: tabular-nums; }
.balance .coin-ico { width: 30px; height: 30px; }
.g-top .spacer { flex: 1; }
.gl-chip { font-size: var(--fs-s); padding: 6px 12px; border-radius: 999px; background: rgba(30, 34, 53, 0.7); color: var(--panel); }
.g-left { display: grid; grid-template-rows: 1fr auto; gap: 8px; min-height: 0; pointer-events: none; }
.g-left > * { pointer-events: auto; }
.stage { min-height: 0; pointer-events: none; }
.strips { display: grid; gap: 8px; }
.chassis-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
.chassis-strip .ch { display: grid; justify-items: center; gap: 2px; font-size: var(--fs-s); text-align: center; color: rgba(30, 34, 53, 0.7); }
.chassis-strip .ch canvas { width: 100%; max-width: 92px; height: 40px; }
.chassis-strip .ch.owned { color: var(--ink); }
.chassis-strip .ch.next b { color: var(--cta); font-weight: 400; }
.hillmap { padding: 8px 12px 10px; }
.hillmap .track { position: relative; height: 34px; margin: 2px 14px 0 4px; }
.hillmap .line { position: absolute; left: 0; right: 0; top: 18px; height: 4px; background: var(--ink); border-radius: 2px; }
.hillmap .fort { position: absolute; top: 11px; width: 16px; height: 16px; margin-left: -8px; border-radius: 5px; border: var(--line) solid var(--ink); background: var(--panel); display: grid; place-items: center; }
.hillmap .fort.done { background: var(--secondary); color: var(--panel); }
.hillmap .fort.done svg { width: 11px; height: 11px; }
.hillmap .fort.todo { background: var(--disabled); border-color: rgba(30, 34, 53, 0.55); }
.hillmap .fort.wall { width: 22px; height: 20px; top: 9px; margin-left: -11px; }
.hillmap .flag { position: absolute; top: -2px; width: 3px; height: 22px; margin-left: -1px; background: var(--ink); }
.hillmap .flag::after { content: ''; position: absolute; left: 3px; top: 0; border-left: 14px solid var(--cta); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.hillmap .bonus { position: absolute; right: -14px; top: -4px; font-size: var(--fs-s); display: inline-flex; align-items: center; }
.hillmap .bonus svg { width: 14px; height: 14px; }
.hillmap .next { font-size: var(--fs-s); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-side { display: grid; grid-template-rows: 1fr auto; gap: 10px; min-height: 0; }
.cards { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
.part {
appearance: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; position: relative;
display: grid; grid-template-columns: 1fr; grid-template-rows: minmax(36px, 1fr) auto auto auto; gap: 1px; padding: 8px 10px 10px; min-height: 48px; min-width: 0;
background: var(--panel); border: var(--line) solid var(--ink); border-radius: var(--r);
box-shadow: inset 0 -5px 0 rgba(30, 34, 53, 0.12), var(--lift); transition: transform 0.12s var(--ease);
}
.part:active { transform: translateY(2px); }
.part canvas { width: 100%; height: 100%; min-height: 36px; }
.part .nm { font-size: var(--fs-m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part .meta { display: flex; align-items: center; gap: 6px; font-size: var(--fs-s); color: rgba(30, 34, 53, 0.66); white-space: nowrap; }
.part .meta [data-slot] { color: var(--ink); }
.part .pips { display: inline-flex; gap: 3px; }
.part .pips i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--ink); }
.part .pips i.on { background: var(--ink); }
.part .delta { font-size: var(--fs-s); color: var(--secondary-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part .cost { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-m); font-variant-numeric: tabular-nums; }
.part .key { position: absolute; top: 6px; right: 8px; font-size: var(--fs-s); color: rgba(30, 34, 53, 0.4); }
.part.t2 { border-color: var(--ink); background: linear-gradient(var(--panel), var(--panel)) padding-box; }
.part[aria-disabled='true'] { background: #ECEEF1; cursor: default; }
.part[aria-disabled='true'] canvas { opacity: 0.55; }
.part[aria-disabled='true'] .cost { color: rgba(30, 34, 53, 0.6); }
.part.max .cost { color: var(--secondary-dark); }
.part.shake { animation: shake 0.2s linear; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.turbo button { width: 100%; }
.play { width: 100%; min-height: 64px; font-size: var(--fs-l); }
.play svg { width: 28px; height: 28px; }
.pointer { position: absolute; z-index: 3; pointer-events: none; display: inline-flex; flex-direction: column; align-items: center; animation: nudge 1s ease-in-out infinite alternate; }
.pointer span { background: var(--sun); border: var(--line) solid var(--ink); border-radius: 10px; padding: 4px 10px; font-size: var(--fs-s); white-space: nowrap; }
.pointer svg { width: 26px; height: 26px; }
@keyframes nudge { to { transform: translateY(-5px); } }
@media (max-aspect-ratio: 13/10) {
.garage { grid-template-columns: 1fr; grid-template-rows: auto minmax(120px, 1fr) auto auto; }
.g-left { grid-template-rows: minmax(110px, 1fr) auto; }
.g-side { grid-template-rows: auto auto; }
.cards { grid-template-rows: auto auto; }
.part { grid-template-rows: 34px auto auto auto; padding: 6px 10px 8px; }
.cards { gap: 8px; }
.chassis-strip .ch canvas { height: 34px; }
}
@media (max-height: 430px) and (min-aspect-ratio: 13/10) {
.chassis-strip { display: none; }
.part { grid-template-rows: minmax(26px, 1fr) auto auto auto; padding: 6px 8px 8px; }
.part .delta { display: none; }
.play { min-height: 52px; }
.g-side { gap: 8px; }
}
.toggles { display: grid; gap: 8px; margin-bottom: 14px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 4px 4px 4px 14px; border-radius: 12px; background: rgba(30, 34, 53, 0.05); font-size: var(--fs-m); }
.switch { appearance: none; width: 64px; height: 40px; border-radius: 999px; border: var(--line) solid var(--ink); background: var(--disabled); position: relative; cursor: pointer; flex: none; transition: background-color 0.18s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink); transition: transform 0.2s var(--ease); }
.switch[aria-checked='true'] { background: var(--secondary); }
.switch[aria-checked='true']::after { transform: translateX(24px); }
.small { font-size: var(--fs-s); color: rgba(30, 34, 53, 0.66); }
details.credits { margin-top: 12px; font-size: var(--fs-s); }
details.credits summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
details.credits pre { white-space: pre-wrap; font-family: inherit; font-size: 12px; line-height: 1.35; max-height: 160px; overflow: auto; background: rgba(30, 34, 53, 0.05); border-radius: 8px; padding: 8px; color: rgba(30, 34, 53, 0.8); }
.danger { background: #FFE3DC; }
.stack { display: grid; gap: 10px; }
* { scrollbar-width: thin; scrollbar-color: var(--secondary) rgba(30, 34, 53, 0.08); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 8px; }
::-webkit-scrollbar-track { background: rgba(30, 34, 53, 0.08); }
.evolve { position: absolute; left: 0; right: 0; top: calc(18% + var(--sat)); display: grid; justify-items: center; gap: 8px; text-align: center; pointer-events: auto; cursor: pointer; padding: 0 16px; }
.evolve .big { font-size: var(--fs-xl); color: var(--sun); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; line-height: 1.05; animation: rise 0.4s var(--ease) 0.9s both; }
.evolve .sub { font-size: var(--fs-m); padding: 6px 14px; animation: rise 0.4s var(--ease) 1.1s both; }
.toast { position: absolute; left: 50%; bottom: calc(96px + var(--sab)); transform: translateX(-50%); padding: 10px 14px 10px 16px; display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); max-width: calc(100% - 32px); animation: rise 0.3s var(--ease); }
.toast .btn { min-height: 46px; min-width: 46px; padding: 0 14px; font-size: var(--fs-s); }
.adlayer { position: absolute; inset: 0; background: rgba(30, 34, 53, 0.7); z-index: 9; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<!--
THESIS: The interface is the lid of a toy box: chunky sticker panels and pressed-block buttons sitting over a live picture-book suburb, where the first screen is already the hill. It refuses the category default of glossy bevelled mobile-game chrome, neon gradients and a title menu before play.
OWN-WORLD: Flat vector toy town. Ink #1E2235 3px outlines, panel #FFFDF7 stickers, tomato CTA #FF5A36 with a pressed bottom band, teal #2EC4B6 for focus and progress, coin #FFD23F. Lilita One only, four sizes (14/18/26/40). Icons drawn in one 2.5 stroke.
STORY: The player sees the hill, holds, releases in the green, smashes a fort, watches coins count up, and spends them on a part that visibly bolts on.
FIRST VIEWPORT: Full-bleed canvas: sky, suburb parallax, the cart on the hilltop deck at 36% x, the SUBURB HILL banner behind it, a drawn hand with "HOLD to push" low centre-right, coins top-left, distance top-centre, a 48px pause sticker top-right. No menu.
FORM: pinned by the brief (SPEC.md section 9), position 1 of 1; seed key: none (brief-pinned world, concept roll skipped by rule).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<canvas id="game" aria-label="Cart to Rocket game"></canvas>
