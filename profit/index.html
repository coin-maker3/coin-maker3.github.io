<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Trade Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#07090f; --card:#10141f; --field:#0b0f18; --line:#1f2738;
  --text:#eef2f9; --muted:#8b96a8; --green:#4ade80; --green2:#22c55e; --red:#f87171; --amber:#fbbf24;
}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior-y:none}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;height:100dvh;overflow:hidden;display:flex;justify-content:center;padding:10px 12px;overscroll-behavior-y:none}
main{width:100%;max-width:460px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tickrow{display:flex;gap:8px}
.tickrow input{flex:1;text-transform:uppercase}
input[type=text],input[type=number]{background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:16px;padding:9px 12px;outline:none;width:100%}
input:focus{border-color:var(--green)}
.btn{background:#1c2436;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px;font-weight:700;padding:0 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--green2);border:none;color:#03140a}
.btn:disabled{opacity:.5}
.bigprice{font-size:38px;font-weight:800;text-align:center;margin:6px 0 0;transition:color .2s;min-height:44px}
.bigprice.up{color:var(--green)}.bigprice.down{color:var(--red)}
.quote{font-size:12px;text-align:center;min-height:15px;color:var(--muted);margin-bottom:2px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--green)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
.live.stale{color:var(--amber)}
.live.stale .dot{background:var(--amber);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.err{color:var(--red)}
.entry{display:flex;gap:8px;margin-top:6px}
.entry input{flex:1}
.lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:8px 0 4px}
.be{display:flex;justify-content:center;align-items:center;gap:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:var(--amber);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;margin-top:6px;min-height:26px}
.stopline{display:flex;justify-content:center;align-items:center;gap:8px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:var(--red);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;margin-top:6px;min-height:26px}
.daylog{text-align:center;color:var(--muted);font-size:11.5px;font-weight:700;margin-top:6px;cursor:pointer}
.daylog b{color:var(--text)}
.pl{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:6px;min-height:34px}
.pl .amt{font-size:28px;font-weight:800}
.pl .pct{font-size:15px;font-weight:800}
.pl .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.pl.up .amt,.pl.up .pct{color:var(--green)}
.pl.down .amt,.pl.down .pct{color:var(--red)}
.tcard{width:100%;border-radius:12px;padding:8px 14px;margin-top:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;cursor:pointer;min-height:64px;text-align:left;color:var(--text)}
.tcard:active{transform:scale(.99)}
.tcard .pct{font-size:13px;font-weight:800;letter-spacing:.5px;min-width:70px}
.tcard .price{font-size:26px;font-weight:800;flex:1;text-align:center}
.tcard .prof{text-align:right;min-width:92px}
.tcard .prof .gbp{font-size:14px;font-weight:800}
.tcard .prof .usd{font-size:10px;color:var(--muted);margin-top:1px}
.tcard.t5{border-color:rgba(74,222,128,.45)}
.tcard.t5 .pct,.tcard.t5 .price,.tcard.t5 .prof .gbp{color:var(--green)}
.tcard.t10{border-color:var(--green);box-shadow:0 0 0 1px rgba(74,222,128,.25)}
.tcard.t10 .pct,.tcard.t10 .price,.tcard.t10 .prof .gbp{color:var(--green)}
.tcard .hint{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.recents{display:flex;flex-wrap:nowrap;gap:6px;margin-top:2px;padding-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:44px}
.recents::-webkit-scrollbar{display:none}
.recents button{flex:none;position:relative;background:var(--field);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:800;cursor:pointer;letter-spacing:.5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.recents button .del{position:absolute;top:-9px;right:-7px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:900;padding:2px 8px;border:2px solid var(--bg);z-index:2}
.recents button .setup{position:absolute;top:-8px;left:-5px;background:var(--amber);color:#3a2a00;border-radius:99px;font-size:8.5px;font-weight:900;letter-spacing:.4px;padding:1.5px 6px;border:2px solid var(--bg)}
.recents button.on{border-color:var(--green);color:var(--green)}
.ghosts{display:flex;gap:8px;margin-top:8px;justify-content:center}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer}
.ghost.on{border-color:var(--green);color:var(--green)}
.gbadge{text-align:center;font-size:15px;font-weight:900;letter-spacing:1.5px;border-radius:10px;padding:5px 0;margin:4px 0 4px}
.gbadge.strong{background:rgba(74,222,128,.14);color:var(--green);border:1px solid rgba(74,222,128,.5)}
.gbadge.medium{background:rgba(251,191,36,.10);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
.gbadge.weak{background:rgba(248,113,113,.10);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.gbadge.loading{background:none;color:var(--muted);border:1px dashed var(--line);font-weight:700;letter-spacing:.5px;font-size:13px}
.greasons{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start;margin-bottom:2px}
.greasons::-webkit-scrollbar{display:none}
.greasons span{flex:none;font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--field);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.greasons span.ok{color:var(--green);border-color:rgba(74,222,128,.35)}
.greasons span.bad{color:var(--red);border-color:rgba(248,113,113,.3)}
.greasons span.warn{color:var(--amber);border-color:rgba(251,191,36,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#e6f9ee;color:#0a3d1f;font-weight:800;font-size:14px;border-radius:99px;padding:10px 20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.note{color:var(--muted);font-size:11.5px;line-height:1.5;text-align:center;margin-top:16px}
a{color:var(--muted);text-decoration:none}
footer{text-align:center;margin-top:10px;font-size:12px}

/* ---- SIM (paper trading) — amber = practice, unmistakable ---- */
#simPanel{margin:10px 0}
.simtoggle{width:100%;border:1px dashed #b8860b;color:#d9a520;background:transparent;font-weight:700}
#simPanel.simon .simtoggle{background:#2a2413;border-style:solid}
.simline{font-size:13px;padding:7px 2px;color:#cfc9b8}
.simline .sub{color:#8a8577;font-size:11px}
.simbad{color:var(--red)}
.simrules{font-size:11px;color:#9a8f6d;border-left:3px solid #b8860b;padding:4px 8px;margin:4px 0}
.simbtns{display:flex;gap:8px;margin-top:6px}
.simbuy{flex:1;border-color:var(--green);color:var(--green);font-weight:800;padding:12px}
.simsell{flex:1;border-color:var(--red);color:var(--red);font-weight:800;padding:12px}
.simrecap{border-color:#555}

/* ---- market hotness ---- */
#mktLine{font-size:12px;padding:4px 2px;color:#8a8577}
#mktLine b.hot{color:#2ecc71}#mktLine b.warm{color:#d9a520}#mktLine b.cold{color:#7f8c9b}
#mktLine .msym{color:#cfc9b8;text-decoration:underline dotted;cursor:pointer;margin-left:6px}

/* SIM on: reclaim vertical space — second target card + % selector hidden (sim shows its own 1:1/2:1 target) */
#simPanel.simon ~ * {}
body.simon #card10, body.simon .ghosts{display:none}
body.simon .tcard{padding:10px 14px}
#simRules{line-height:1.35}

@media (max-height:800px){
  .bigprice{font-size:40px}
  .tcard{padding:8px 12px}
  .gbadge{padding:6px}
  .simline{padding:4px 2px;font-size:12px}
  #simRules{font-size:10px}
  .simbuy,.simsell{padding:9px}
  #mktLine{font-size:11px;padding:2px}
}

/* entry-rhythm recommendation */
#entryLine{font-size:12px;color:#9fb3c8;border-left:3px solid #3b6ea5;padding:4px 8px;margin:4px 0;line-height:1.45}
#entryLine b{color:#cfe3f5}
/* IN-TRADE MODE: discovery UI disappears — the screen asks "why haven't you sold?" */
body.intrade .recents, body.intrade #mktLine, body.intrade #gauge, body.intrade #entryLine,
body.intrade #card5, body.intrade #card10, body.intrade .ghosts, body.intrade #dayLog,
body.intrade #simRules, body.intrade #simToggle, body.intrade .be{display:none}
body.intrade #simPos{font-size:15px;line-height:1.7;padding:10px 4px;border-top:1px solid #333;border-bottom:1px solid #333}
body.intrade .simsell{padding:18px;font-size:18px}
/* sim on = always compact (real phones lose height to browser chrome) */
body.simon .bigprice{font-size:38px}
body.simon .tcard{padding:8px 12px}
body.simon #mktLine{font-size:11px;padding:2px}
body.simon .gbadge{padding:6px}

/* ---- ARM / in-trade / chips / day-end (expert package) ---- */
#armLine{border-left:3px solid var(--green);padding:6px 8px;margin:4px 0;font-size:13px}
.abtn{padding:6px 12px;margin-left:8px;font-size:12px}
.afill{border-color:var(--green);color:var(--green);font-weight:800}
#inTrade{padding:8px 4px;border-top:1px solid #333;border-bottom:1px solid #333;margin:6px 0}
.itop{font-size:16px}.imid{font-size:13px;color:#cfc9b8;margin:4px 0}
.ipl{font-size:34px;font-weight:800}.ipct{font-size:16px;font-weight:600}
.igb{color:var(--red);font-weight:700;font-size:14px;margin:2px 0}.igb.ok{color:#8a8577;font-weight:600}
.ttimer{font-weight:800;margin-left:10px}.tg{color:var(--green)}.ta{color:#d9a520}.tr{color:var(--red)}
.iout{width:100%;padding:16px;margin-top:8px;border-color:var(--red);color:var(--red);font-weight:800;font-size:17px}
body.intrade .recents,body.intrade #mktLine,body.intrade #gauge,body.intrade #entryLine,
body.intrade #card5,body.intrade #card10,body.intrade .ghosts,body.intrade #dayLog{display:none}
/* greed cuts: extra target card + % selector gone for good */
#card10,.ghosts{display:none}
#chipsBox{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:60;align-items:center;justify-content:center}
.chipwrap{display:flex;flex-direction:column;gap:10px;width:78%;max-width:320px}
.chiphead{color:#cfc9b8;font-weight:700;text-align:center;font-size:15px}
.dchip{padding:13px;font-size:15px}.dskip{opacity:.6}
.deover{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center}
.degood{background:rgba(10,46,28,.97)}.debad{background:rgba(56,14,14,.97)}
.debox{text-align:center;width:82%}
.debig{font-size:30px;font-weight:800;color:#fff}
.denum{font-size:44px;font-weight:800;margin:8px 0;color:#fff}
.destreak{font-size:16px;color:#d9e5dc;margin:6px 0}
.deplan{font-size:14px;color:#aab8ae;margin:10px 0}
.deok{width:100%;padding:15px;font-size:17px;font-weight:800;margin-top:8px}
.devi{width:100%;padding:9px;font-size:12px;opacity:.55;margin-top:10px}

.rok{color:var(--green)}.rbad{color:var(--red)}.rwarn{color:#d9a520}
.peakbig{font-size:26px;font-weight:800;text-align:center;margin:4px 0}
.peakbig .ppk{font-size:15px;font-weight:600;color:#8a8577}
.fuel{height:11px;background:#1c1c1c;border-radius:6px;overflow:hidden;margin:6px 0}
.fuelfill{height:100%;transition:width .3s,background .3s}
.stopdist{font-size:14px;font-weight:700;text-align:center;margin:2px 0}
.isub{font-size:13px;color:#9a978c;text-align:center;margin:2px 0}
.extbadge{font-size:10px;color:#d9a520;border:1px solid #6a5410;border-radius:4px;padding:1px 5px;font-weight:700}
.iotake{border-color:var(--green)!important;color:var(--green)!important;animation:pulseb .7s infinite}
.iostop{border-color:var(--red)!important;color:var(--red)!important;animation:pulseb .5s infinite}
@keyframes pulseb{50%{opacity:.55}}
body.intrade main>*:not(#inTrade){display:none!important}
</style>
</head>
<body>
<main>
<div class="tickrow">
  <input id="ticker" type="text" autocapitalize="characters" autocomplete="off" placeholder="symbol — TSLA, AAPL…">
  <button class="btn primary" id="fetchBtn">Go live</button>
</div>
<div class="recents" id="recents"></div>
<div id="mktLine" class="mono" hidden></div>
<div class="bigprice mono" id="bigPrice">—</div>
<div class="quote" id="quote"></div>
<div id="gauge" hidden>
  <div class="gbadge" id="gBadge">—</div>
  <div class="greasons" id="gReasons"></div>
</div>
<div id="entryLine" class="mono" hidden></div>
<div id="armLine" class="mono" hidden></div>
<div id="inTrade" class="mono" hidden></div>
<input id="cur" type="hidden">

<div class="lbl">My entry price ($) · shares</div>
<div class="entry">
  <input id="avg" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="entry price">
  <input id="shares" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="shares" style="max-width:110px">
  <button class="btn" id="grabBtn" title="stamp the live price as my entry">Use live</button>
</div>

<div class="entry">
  <input id="stop" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="stop price ($)">
  <input id="risk" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="risk £" style="max-width:110px">
  <button class="btn" id="soldBtn" title="log this trade as closed at the live price">LOG</button>
</div>
<div class="stopline mono" id="stopLine" hidden></div>
<div class="pl mono" id="plLine" hidden>
  <span class="sub">P/L now</span><span class="amt" id="plAmt">—</span><span class="pct" id="plPct"></span>
</div>
<div class="be mono" id="beLine" hidden></div>

<button class="tcard t5" id="card5">
  <span class="pct">+5% NET</span>
  <span class="price mono" id="p5">—</span>
  <span class="prof"><div class="gbp mono" id="g5">—</div><div class="usd mono" id="u5"></div><div class="hint">tap to copy</div></span>
</button>
<button class="tcard t10" id="card10">
  <span class="pct" id="pct10">+10% NET</span>
  <span class="price mono" id="p10">—</span>
  <span class="prof"><div class="gbp mono" id="g10">—</div><div class="usd mono" id="u10"></div><div class="hint">tap to copy</div></span>
</button>
<div class="daylog mono" id="dayLog" hidden></div>
<div id="planLine" class="mono simline" hidden></div>
<div class="ghosts">
  <button class="ghost" data-p="10">10%</button>
  <button class="ghost" data-p="20">20%</button>
  <button class="ghost" data-p="25">25%</button>
</div>


</main>
<div id="chipsBox" style="display:none">
  <div class="chipwrap"><div class="chiphead">How did you trade it?</div>
    <button class="btn dchip" data-t="followed plan">✅ followed plan</button>
    <button class="btn dchip" data-t="chased">🏃 chased</button>
    <button class="btn dchip" data-t="held past peak">🎈 held past peak</button>
    <button class="btn dchip" data-t="froze in loser">🧊 froze in loser</button>
    <button class="btn dchip dskip" data-t="">skip</button></div></div>
<div id="dayEnd" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// ---- Trading 212 UK Invest (GBP) real costs — verified July 2026, silent by design ----
// FX fee 0.15% each way (baked into T212's rate) · SEC 0.00278% of sell value ·
// FINRA TAF $0.000195/share sold. Commission zero. FX rate cancels for % targets:
//   P_sell = ( P_buy·(1+x)·(1+f)/(1−f) + t ) / (1−s), then round UP to the cent.
// Unit tests: buy $10.00 → +5% limit $10.54 · +10% limit $11.04 · break-even $10.04.
const F = 0.0015, S = 0.0000278, T = 0.000195;
function limitFor(buy, x){
  const raw = (buy * (1 + x) * (1 + F) / (1 - F) + T) / (1 - S);
  return Math.ceil(raw * 100 - 1e-9) / 100;
}
function breakEven(buy){ return limitFor(buy, 0); }

// ---- state persistence (per-device) ----
const FIELDS = ['ticker'];
try {
  const saved = JSON.parse(localStorage.getItem('profit_state_v3') || '{}');
  FIELDS.forEach(id => { if (saved[id] != null && saved[id] !== '' && !$(id).value) $(id).value = saved[id]; });
} catch(e){}
function saveState(){
  try { const s = {}; FIELDS.forEach(id => s[id] = $(id).value);
        localStorage.setItem('profit_state_v3', JSON.stringify(s)); } catch(e){}
}
FIELDS.forEach(id => $(id).addEventListener('input', () => { saveState(); calc(); }));

// ---- PER-SYMBOL positions: your entry belongs to ONE stock. Switching symbols
// shows THAT symbol's saved entry/shares/stop (or blanks) — never yesterday's
// numbers against another stock's price (the "massive fake gain" bug).
const POS_FIELDS = ['avg','shares','stop','risk'];
function loadPositions(){ try { return JSON.parse(localStorage.getItem('positions_v1') || '{}'); } catch(e){ return {}; } }
function savePosition(){
  if (!liveSym) return;
  const pos = loadPositions();
  const v = {};
  let any = false;
  POS_FIELDS.forEach(id => { v[id] = $(id).value; if (v[id] !== '') any = true; });
  if (any) pos[liveSym] = v; else delete pos[liveSym];
  try { localStorage.setItem('positions_v1', JSON.stringify(pos)); } catch(e){}
}
function applyPosition(sym){
  const v = loadPositions()[sym] || {};
  POS_FIELDS.forEach(id => { $(id).value = v[id] || ''; });
}
POS_FIELDS.forEach(id => $(id).addEventListener('input', () => { savePosition(); calc(); }));

// ---- GBP/USD for the £ profit figures (silent; falls back to $-only) ----
let GBPUSD = null;
async function refreshFx(){
  try {   // live-ish cable via Yahoo (proxy race) — ECB daily ref can lag 0.3-0.5%
    const res = await fetchCandles('GBPUSD=X');
    const r = res && res.meta && res.meta.regularMarketPrice;
    if (r > 0){ GBPUSD = r; calc(); return; }
  } catch(e){}
  try {
    const r = await fetch('https://api.frankfurter.dev/v1/latest?base=GBP&symbols=USD');
    const j = await r.json();
    if (j && j.rates && j.rates.USD){ GBPUSD = j.rates.USD; calc(); }
  } catch(e){}
}
setTimeout(refreshFx, 800); setInterval(refreshFx, 300000);

// ---- live price: Finnhub quote + WebSocket stream, Yahoo/proxy fallback ----
// Finnhub free /quote FREEZES at the 16:00 ET close (its t stops moving), so outside
// regular hours we pull the last 1-min extended print from Yahoo (includePrePost)
// and label it honestly: PRE-MKT / AFTER-HRS / LAST CLOSE. Verified 13 Jul 2026:
// AAPL after-hours — Finnhub c stuck 115 min, Yahoo 1m candle 0 min old.
const FINNHUB_KEY = 'd9afnh1r01qg31s4h340d9afnh1r01qg31s4h34g';
let extCache = { sym: null, at: 0, p: 0, tag: '' };            // 8s cache so 3s polling doesn't hammer proxies
async function fetchExtended(symbol){
  if (extCache.sym === symbol && Date.now() - extCache.at < 8000 && extCache.p > 0) return extCache;
  // &cb= busts PROXY-side caching: corsproxy/allorigins serve the identical URL from
  // cache for minutes (proven 13 Jul 2026: same candle returned 75s apart plain; fresh with cb)
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(symbol) + '?range=1d&interval=1m&includePrePost=true&cb=' + Date.now();
  for (const wrap of [u => u, u => 'https://corsproxy.io/?url=' + encodeURIComponent(u), u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)]){
    try {
      const j = await jget(wrap(url), 8000);          // 8s cap — a hung proxy socket must not stall the poll pipeline
      const res = j?.chart?.result?.[0];
      if (!res){ if (j?.chart?.error) break; continue; }
      const ts = res.timestamp || [], cl = res.indicators?.quote?.[0]?.close || [];
      let i = cl.length - 1;
      while (i >= 0 && cl[i] == null) i--;
      if (i < 0 || !(cl[i] > 0)){                              // no candles — old regular-hours fallback
        const p = res.meta && res.meta.regularMarketPrice;
        if (p > 0){ extCache = { sym: symbol, at: Date.now(), p: p, tag: '' }; return extCache; }
        break;
      }
      const ageH = (Date.now() / 1000 - ts[i]) / 3600;
      const reg = res.meta && res.meta.currentTradingPeriod && res.meta.currentTradingPeriod.regular;
      let tag = '';

  // hours-old frozen close (which would move the shown price BACKWARDS)
  if (extCache.sym === symbol && extCache.p > 0 && Date.now() - extCache.at < 600000) return extCache;
  return null;
}

// Criteria per Warrior Trading / "How to Day Trade" (verified Jul 2026):
// gain >= +10% today · RVOL >= 2 (>=5 ideal) · price $2-20 · float <= 20M (approx
// via shares outstanding — upper bound) · news catalyst within 48h.
// STRONG = core + all 3 quality; MEDIUM = core + >=1; WEAK = otherwise.
// Caps to MEDIUM: price only half-in-band ($1-2 / $20-30), float >50M, volume
// unknown (pre-market), or an offering/dilution headline (Ross red flag).
function rateStock(d){
  const reasons = [];
  const rvolKnown = d.rvol != null && isFinite(d.rvol);
  const rvolOk = rvolKnown && d.rvol >= 2, rvolHot = rvolKnown && d.rvol >= 5;
  // price: $2-20 classic band; sub-$1 pennies COUNT as in-band when volume proves the build-up (Ali 17 Jul)
  const subP = d.price >= 0.10 && d.price < 2;
  const pFull = (d.price >= 2 && d.price <= 20) || (subP && rvolHot);
  const pHalf = (subP && !rvolHot) || (d.price > 20 && d.price <= 30);
  reasons.push({cls: pFull ? 'ok' : pHalf ? 'warn' : 'bad',
    t: '$' + (d.price!=null?d.price.toFixed(2):'?') + (subP ? (rvolHot ? ' penny — volume proves build-up' : ' penny — needs RVOL ≥5 to qualify') : pFull ? ' in $2–20' : pHalf ? ' edge of band' : ' out of band')});
  const gainOk = d.gain != null && d.gain >= 10;
  reasons.push({cls: gainOk ? 'ok' : 'bad', t: (d.gain!=null?(d.gain>=0?'+':'')+d.gain.toFixed(1):'?') + '% today'});
  reasons.push({cls: !rvolKnown ? 'warn' : rvolHot ? 'ok' : rvolOk ? 'warn' : 'bad', t: rvolKnown ? 'RVOL ' + d.rvol.toFixed(1) + '×' : 'volume unknown yet'});
  const fKnown = d.floatM != null;
  const fOk = fKnown && d.floatM <= 20, fBig = fKnown && d.floatM > 50;
  reasons.push({cls: !fKnown ? 'warn' : fOk ? 'ok' : fBig ? 'bad' : 'warn', t: fKnown ? '~' + Math.round(d.floatM) + 'M shares (approx float)' : 'float unknown'});
  reasons.push({cls: d.news ? 'ok' : 'bad', t: d.news ? 'news ' + d.newsAge : 'no fresh news'});
  if (d.offering) reasons.push({cls:'bad', t:'⚠ OFFERING headline — dilution risk (pennies dilute MOST)'});
  const core = (pFull || pHalf) && gainOk && (rvolOk || !rvolKnown);
  let q = 0; if (rvolHot) q++; if (fOk) q++; if (d.news) q++;
  let v = (core && q === 3) ? 'STRONG' : (core && q >= 1) ? 'MEDIUM' : 'WEAK';
  if (v === 'STRONG' && (pHalf || fBig || !rvolKnown || d.offering)) v = 'MEDIUM';
  if (fBig && v !== 'WEAK' && q <= 1) v = 'WEAK';
  return {verdict: v, reasons};
}

// ================= SETUP badge engine (expert-designed, Jul 2026) =================
// The 4 consensus intraday momentum conditions, ALL required (5-min candles):
//   1. price > session VWAP        2. EMA9 > EMA20 (incl. pre-market seed)
//   3. price >= 99.5% of HOD       4. current 5m volume >= 1.5x avg of prior 10
// Hard gates (badge NEVER shows): market closed / first 15 min, stock red on day,
// <25 candles or <3 regular candles, or data unfetchable — absence of data is
// absence of signal. Amber "SETUP", not "BUY": conditions aligned, not advice.
function emaCalc(vals, n){
  if (vals.length < n) return null;
  let e = vals.slice(0, n).reduce((a,b) => a+b, 0) / n;
  const k = 2 / (n + 1);
  for (let i = n; i < vals.length; i++) e = vals[i] * k + e * (1 - k);
  return e;
}
function computeSetup(res, last, dp, nowSec){
  // Session-aware (Ali 17 Jul): works in PRE (from 4:15am ET) and AFTER-HOURS too.
  // VWAP + HOD anchored from the 4am pre-market start (Warrior-style); day gain computed
  // from candles vs previous close, so a stock dead in RTH but ripping extended still counts.
  try {
    if (!(last > 0)) return false;
    const ts = res.timestamp || [], q = res.indicators.quote[0];
    const ctp = res.meta.currentTradingPeriod;
    const reg0 = ctp.regular.start, reg1 = ctp.regular.end;
    const pre0 = (ctp.pre && ctp.pre.start) || reg0 - 19800;
    const post1 = (ctp.post && ctp.post.end) || reg1 + 14400;
    const now = nowSec || (Date.now() / 1000);
    if (now < pre0 + 900 || now > post1) return false;     // 15-min warmup after 4am; overnight = off
    if (now >= reg0 && now < reg0 + 900) return false;     // still skip the open's first 15 min (noise)
    const prevC = res.meta.chartPreviousClose || res.meta.previousClose || null;
    const gain = (prevC > 0) ? (last - prevC) / prevC * 100 : dp;   // sees extended moves (Finnhub dp freezes at close)
    if (gain == null || gain <= 0) return false;
    const cands = [];
    for (let i = 0; i < ts.length; i++)
      if (q.close[i] != null) cands.push({t: ts[i], h: q.high[i], l: q.low[i], c: q.close[i], v: q.volume[i] || 0});
    if (cands.length < 12) return false;                   // ~1h of prints today minimum
    let pv = 0, vv = 0;
    cands.forEach(c => { if (c.v > 0){ pv += ((c.h + c.l + c.c) / 3) * c.v; vv += c.v; } });
    if (!vv) return false;
    const vwap = pv / vv;
    const e9 = emaCalc(cands.map(c => c.c), 9), e20 = emaCalc(cands.map(c => c.c), 20);
    if (e9 == null || e20 == null) return false;
    const hod = Math.max(...cands.map(c => c.h));
    const lastC = cands[cands.length - 1];
    const elapsed = now - lastC.t;
    if (elapsed > 600) return false;                       // candles stale (cached proxy) — no signal
    let curVol;
    if (elapsed < 60 && cands.length >= 2) curVol = cands[cands.length - 2].v;
    else curVol = lastC.v * (300 / Math.min(Math.max(elapsed, 60), 300));
    const prior = cands.slice(-11, -1);
    if (prior.length < 5) return false;
    const avg = prior.reduce((a,c) => a + c.v, 0) / prior.length;
    if (!(avg > 0)) return false;
    return last > vwap && e9 > e20 && last >= 0.995 * hod && curVol >= 1.5 * avg;
  } catch(e){ return false; }
}

function fmt(n, dp=2){ return n.toLocaleString('en-US',{minimumFractionDigits:dp, maximumFractionDigits:dp}); }

function fillCard(pEl, gEl, uEl, buy, shares, x){
  $(pEl).textContent = '$' + fmt(limitFor(buy, x));
  const profUSD = (!isNaN(shares) && shares > 0) ? x * shares * buy * (1 + F) : null;
  if (profUSD != null){
    if (GBPUSD){ $(gEl).textContent = '+£' + fmt(profUSD / GBPUSD); $(uEl).textContent = '+$' + fmt(profUSD); }
    else { $(gEl).textContent = '+$' + fmt(profUSD); $(uEl).textContent = ''; }
  } else { $(gEl).textContent = '—'; $(uEl).textContent = ''; }
}

function calc(){
  const buy = parseFloat($('avg').value);
  const shares = parseFloat($('shares').value);
  if (isNaN(buy) || buy <= 0){
    $('beLine').hidden = true;
    $('plLine').hidden = true;
    $('stopLine').hidden = true;
    $('p5').textContent = '—'; $('g5').textContent = '—'; $('u5').textContent = '';
    $('p10').textContent = '—'; $('g10').textContent = '—'; $('u10').textContent = '';
    return;
  }
  const be = breakEven(buy);
  const cur = parseFloat($('cur').value);
  let beTxt = 'Flat at $' + fmt(be);
  if (!isNaN(cur) && cur > 0) beTxt += (cur >= be ? '  ·  you are UP' : '  ·  below break-even');
  $('beLine').textContent = beTxt;
  $('beLine').hidden = false;
  // live P/L NOW — what he truly walks away with if he sold at the live price,
  // after ALL T212 costs (same model as the targets). Updates on every tick.
  if (!isNaN(cur) && cur > 0 && !isNaN(shares) && shares > 0){
    const cost = shares * buy * (1 + F);
    const proceeds = (shares * cur * (1 - S) - shares * T) * (1 - F);
    const pl = proceeds - cost, plPct = pl / cost * 100;
    const up = pl >= 0, sign = up ? '+' : '−';
    $('plAmt').textContent = GBPUSD ? sign + '£' + fmt(Math.abs(pl) / GBPUSD) : sign + '$' + fmt(Math.abs(pl));
    $('plPct').textContent = sign + fmt(Math.abs(plPct)) + '%';
    const el = $('plLine'); el.className = 'pl mono ' + (up ? 'up' : 'down'); el.hidden = false;
  } else {
    $('plLine').hidden = true;
  }
  // stop-loss guardrail + risk-based position size (net of ALL costs, like everything here)
  const stopP = parseFloat($('stop').value), riskGBP = parseFloat($('risk').value);
  if (!isNaN(stopP) && stopP > 0 && stopP < buy){
    const lossPS = buy * (1 + F) - ((stopP * (1 - S) - T) * (1 - F));   // $ lost per share if stopped
    let t = 'STOP $' + fmt(stopP);
    if (!isNaN(shares) && shares > 0){
      const lossTot = lossPS * shares;
      t += ' → −' + (GBPUSD ? '£' + fmt(lossTot / GBPUSD) : '$' + fmt(lossTot));
    }
    const gain5PS = 0.05 * buy * (1 + F);                                // net $ gain/share at the +5% card
    if (lossPS > 0) t += ' · R:R 1:' + fmt(gain5PS / lossPS, 1);
    if (!isNaN(riskGBP) && riskGBP > 0 && GBPUSD && lossPS > 0)
      t += ' · size for £' + fmt(riskGBP, 0) + ': ' + Math.floor(riskGBP * GBPUSD / lossPS) + ' sh';
    $('stopLine').textContent = t;
    $('stopLine').hidden = false;
  } else {
    $('stopLine').hidden = true;
  }
  fillCard('p5','g5','u5', buy, shares, 0.05);
  fillCard('p10','g10','u10', buy, shares, alt/100);
}

// tap a card = copy its limit price (kills transcription errors into T212)
function copyCard(priceId){
  const t = $(priceId).textContent.replace('$','');
  if (!t || t === '—') return;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => {
    const toast = $('toast');
    toast.textContent = t + ' copied — paste into your T212 limit order';
    toast.classList.add('show');
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(() => toast.classList.remove('show'), 1800);
  }).catch(()=>{});
}
$('card5').addEventListener('click', () => copyCard('p5'));
$('card10').addEventListener('click', () => copyCard('p10'));

// Mover = price $1-20, up >=10%, volume >=500k. HOT >=5 movers / WARM 2-4 / COLD 0-1.
let MKT = null;
function mktLoad(){ try{ return JSON.parse(localStorage.getItem('mkt_v1')||'null'); }catch(e){ return null; } }
async function mktScreen(scr){
  const Y='https://query1.finance.yahoo.com/v1/finance/screener/predefined/saved?scrIds='+scr+'&count=50';
  const urls=['https://corsproxy.io/?url='+encodeURIComponent(Y)+'&cb='+Date.now(),
              'https://api.allorigins.win/raw?url='+encodeURIComponent(Y+'&cb='+Date.now())];
  for(const u of urls){
    try{ const r=await fetch(u,{signal:AbortSignal.timeout(9000)}); const j=await r.json();
         const q=j?.finance?.result?.[0]?.quotes; if(q&&q.length) return q; }catch(e){}
  }
  return [];
}
async function refreshMkt(force){
  const cached=mktLoad();
  if(!force && cached && Date.now()-cached.t<5*60*1000){ MKT=cached; renderMkt(); return; }
  const [a,b]=await Promise.all([mktScreen('day_gainers'), mktScreen('small_cap_gainers')]);
  const sess=(typeof etSession==='function'&&etSession())||'RTH';
  const seen={}, movers=[];
  a.concat(b).forEach(x=>{
    if(seen[x.symbol]) return; seen[x.symbol]=1;
    const v=x.regularMarketVolume||0;
    // rank by what is moving NOW in this session — a day-gainer that is flat after hours is yesterday's party
    let p,c,tag='';
    if(sess==='PRE'&&x.preMarketChangePercent!=null){ p=x.preMarketPrice||x.regularMarketPrice; c=x.preMarketChangePercent; tag='PRE'; }
    else if(sess==='AH'&&x.postMarketChangePercent!=null){ p=x.postMarketPrice||x.regularMarketPrice; c=x.postMarketChangePercent; tag='AH'; }
    else { p=x.regularMarketPrice; c=x.regularMarketChangePercent; }
    const bar = tag ? 5 : 10;                               // extended sessions: +5% NOW is a real move
    if(p>=0.1&&p<=20&&c>=bar&&(v*p)>=1e6) movers.push({s:x.symbol,c:Math.round(c),p:p,tag:tag});
  });
  movers.sort((x,y)=>y.c-x.c);
  if(!a.length&&!b.length){ MKT={t:Date.now(),temp:'UNKNOWN',n:0,top:[]}; }
  else{ const n=movers.length;
        MKT={t:Date.now(), temp:n>=5?'HOT':n>=2?'WARM':'COLD', n:n, top:movers.slice(0,3)}; }
  try{ localStorage.setItem('mkt_v1',JSON.stringify(MKT)); }catch(e){}
  renderMkt();
}
function renderMkt(){
  const el=$('mktLine'); if(!MKT){ el.hidden=true; return; }
  if(MKT.temp==='UNKNOWN'){ el.innerHTML='MARKET: <b class="cold">temp unknown</b> (screener unreachable)'; el.hidden=false; return; }
  const cls=MKT.temp==='HOT'?'hot':MKT.temp==='WARM'?'warm':'cold';
  let h='MARKET: <b class="'+cls+'">'+MKT.temp+'</b> · '+MKT.n+' in play';
  if(MKT.temp==='COLD') h+=' — maybe no trade';
  MKT.top.forEach(m=>{ h+='<span class="msym" data-s="'+m.s+'">'+m.s+' $'+(m.p<1?m.p.toFixed(2):m.p.toFixed(0))+' +'+m.c+'%'+(m.tag?' '+m.tag:'')+'</span>'; });
  el.innerHTML=h; el.hidden=false;
  el.querySelectorAll('.msym').forEach(x=>x.addEventListener('click',()=>{ $('ticker').value=x.dataset.s; $('fetchBtn').click(); }));
}
MKT=mktLoad(); renderMkt();
refreshMkt(); setInterval(()=>refreshMkt(), 5*60*1000);


// ================= ENTRY RHYTHM (pullback-zone recommendation — honest: a limit zone, never "buy now") =================
// ---- SECOND-LEG HEALTH: reads volume + structure, decides if a pulled-back stock can rip again ----
// Core rule (expert): don't buy the dip — buy the RECLAIM. Volume must dry up on the dip, then
// expand on a candle that closes back above VWAP. Volume is invisible to the user; it's baked in here.
function secondLegHealth(cands, vwap, last, e9){
  const n=cands.length;
  if(n<12 || !(vwap>0) || !(last>0)) return {state:'WAIT', entry:last||vwap, trigger:vwap||last, note:'not enough data yet'};
  const highs=cands.map(c=>c.h);
  const hod=Math.max.apply(null,highs);
  let hi=highs.lastIndexOf(hod);
  if(hi>=n-1) return {state:'HIGHS', entry:last, trigger:hod, note:'making new highs'};
  const pb=cands.slice(hi+1);
  if(pb.length<2) return {state:'HIGHS', entry:last, trigger:hod, note:'just off the high'};
  const leg=cands.slice(Math.max(0,hi-10), hi+1);
  const launch=leg.slice(-5);                              // the launch pad, not the whole run's base (bug fix)
  const legAvgV=(leg.reduce((a,c)=>a+c.v,0)/leg.length)||1;
  const pbDip=pb.length>1?pb.slice(0,-1):pb;                // exclude the reclaim bar from the dip average
  const pbAvgV=pbDip.reduce((a,c)=>a+c.v,0)/pbDip.length;
  const contraction=pbAvgV/legAvgV;
  const launchLow=Math.min.apply(null,launch.map(c=>c.l));
  const pbLow=Math.min.apply(null,pb.map(c=>c.l));
  const rise=hod-launchLow;
  const retr= rise>0 ? (hod-pbLow)/rise : 1;               // depth vs the launch, not the far base
  const higherLow= pbLow >= launchLow*0.997;
  const closesBelow=pb.filter(c=>c.c<vwap).length;
  const accepted= closesBelow>=3 && closesBelow>=pb.length*0.6;   // scales to short pullbacks
  const trigger=Math.max(vwap, pb.length>1?Math.max.apply(null,pb.slice(0,-1).map(c=>c.c)):vwap);
  const recent=cands.slice(-4,-1);
  const recentAvgV=recent.length?recent.reduce((a,c)=>a+c.v,0)/recent.length:legAvgV;
  const expansion= cands[n-1].v >= 2.0*recentAvgV;        // a real reclaim thrust, not noise
  if(retr>0.75 || !higherLow || accepted)
    return {state:'BROKEN', entry:trigger, trigger, note: !higherLow?'lower low — no bid':accepted?'living below VWAP':'gave back the move'};
  const above=last>=vwap, dried=contraction<0.6;
  if(above && dried && expansion)
    return {state:'HEALTHY', entry:last, trigger, note:'volume dried, reclaim on real volume'};
  return {state:'WAIT', entry:last, trigger, note: !dried?'volume still heavy on the dip':(!above?'still below VWAP':'reclaim not confirmed (needs volume)')};
}
async function planEntry(sym){
  const el=$('entryLine'); el.hidden=true;
  try{
    if(Date.now()<COOL){ el.innerHTML='RHYTHM: cooling down — no entries for '+Math.ceil((COOL-Date.now())/60000)+' min'; el.hidden=false; return; }
    if(!etSession()){ el.innerHTML='RHYTHM: market closed — zones reset in pre-market'; el.hidden=false; return; }
    const res=await fetchCandles(sym); if(!res||sym!==liveSym) return;
    const _ts=res.timestamp||[]; if(_ts.length && (Date.now()/1000-_ts[_ts.length-1])>1800){ el.innerHTML='RHYTHM: data stale — no read'; el.hidden=false; return; }
    const q=res.indicators.quote[0], ts=res.timestamp||[];
    const cands=[]; for(let i=0;i<ts.length;i++) if(q.close[i]!=null) cands.push({h:q.high[i],l:q.low[i],c:q.close[i],v:q.volume[i]||0});
    if(cands.length<10) return;
    let pv=0,vv=0; cands.forEach(c=>{ if(c.v>0){ pv+=((c.h+c.l+c.c)/3)*c.v; vv+=c.v; } });
    const vwap=vv?pv/vv:null;
    const e9=emaCalc(cands.map(c=>c.c),9);
    const last=parseFloat($('cur').value)||cands[cands.length-1].c;
    if(!(vwap>0)||!(last>0)) return;
    const dp=(x)=>x<1?x.toFixed(3):x.toFixed(2);
    const H=secondLegHealth(cands, vwap, last, e9);
    const entry=H.entry, stop=+(entry*0.95).toFixed(entry<1?3:2);
    const tgt=+(entry+2*(entry-stop)).toFixed(entry<1?3:2), tenN=limitFor(entry,0.10);
    let h, armable=false, fresh=false, uEntry=entry, uStop=stop, uTgt=tgt;
    if(H.state==='BROKEN'){ h='RHYTHM: <b class="rbad">BROKEN — stay out</b>. '+H.note+'.'; }
    else if(H.state==='WAIT'){ h='RHYTHM: <b>WAIT — no reclaim</b>. Trigger $'+dp(H.trigger)+' · '+H.note+'.'; }
    else if(H.state==='HIGHS'){
      const e20=emaCalc(cands.map(c=>c.c),20);
      const mom = last>=vwap && (e20==null || e9>=e20);          // fresh entry only with real momentum
      if(mom){ uEntry=last; uStop=+(last*0.95).toFixed(last<1?3:2); uTgt=+(uEntry+2*(uEntry-uStop)).toFixed(last<1?3:2);
        h='RHYTHM: <b class="rwarn">FRESH — new highs, no pullback</b> (higher-risk chase) · enter ~$'+dp(uEntry)+' · stop $'+dp(uStop)+' · 2:1 $'+dp(uTgt); armable=true; fresh=true; }
      else { h='RHYTHM: <b>at highs</b> — momentum not confirmed; wait for the pullback.'; }
    }
    else { h='RHYTHM: <b class="rok">RECLAIM CONFIRMED</b> — enter ~$'+dp(entry)+' · stop $'+dp(stop)+' · 2:1 $'+dp(tgt)+' · +10% net $'+dp(tenN); armable=true; }
    el.innerHTML=h+' <span style="color:#667">· your call</span>'
      +(armable?' <button class="btn abtn afill" id="armBtn">ARM</button><button class="btn abtn" id="declBtn" title="log the pick without trading">DECLARE</button>':'');
    window._lastZone={sym:sym, zone:+dp(uEntry), stop:uStop, target:uTgt, tenNet:limitFor(uEntry,0.10), fresh:fresh};
    el.hidden=false;
    const ab=$('armBtn'), db=$('declBtn');
    if(ab) ab.onclick=armTrade;
    if(db) db.onclick=()=>{ if(declarePick(false)) tost('Pick declared — timestamped for the edge test'); };
  }catch(e){}
}

// ================= REAL TRADING — the £200 compound plan on YOUR LOGGED TRADES =================
// No sim. You trade real money on T212; every round trip goes in via LOG; this strip
// tracks equity vs the plan (£200 × 1.05^tradedDay), today's +5% goal and −5% floor.
function etParts(){ const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,year:'numeric',month:'2-digit',day:'2-digit'}); const p={}; f.formatToParts(new Date()).forEach(x=>p[x.type]=x.value); return p; }
function etSession(){ const p=etParts();
  if(p.weekday==='Sat'||p.weekday==='Sun') return null;
  const m=(+p.hour)*60+(+p.minute);
  if(m>=240&&m<570) return 'PRE'; if(m>=570&&m<960) return 'RTH'; if(m>=960&&m<1200) return 'AH'; return null; }
let PLAN=null; try{ PLAN=JSON.parse(localStorage.getItem('plan_v1')||'null'); }catch(e){}
if(!PLAN){ PLAN={start:new Date().toISOString().slice(0,10), eq0:200};
  try{ localStorage.setItem('plan_v1',JSON.stringify(PLAN)); }catch(e){} }
let _planState='';
function renderPlan(){
  const el=$('planLine'); if(!el) return;
  const t=loadTrades().filter(x=>x.d.slice(0,10)>=PLAN.start);
  const days={}; t.forEach(x=>{ const k=x.d.slice(0,10); days[k]=(days[k]||0)+x.netGBP; });
  const today=new Date().toISOString().slice(0,10);
  const todayNet=days[today]||0;
  const eq=PLAN.eq0+t.reduce((a,x)=>a+x.netGBP,0);
  const priorDays=Object.keys(days).filter(k=>k<today).length;
  const dayStartEq=eq-todayNet;
  const goal=dayStartEq*0.05, floor=-dayStartEq*0.05;
  const plan=PLAN.eq0*Math.pow(1.05,priorDays);
  let st='';
  if(todayNet>=goal) st=' · <b style="color:var(--green)">GOAL HIT — walk away</b>';
  else if(todayNet<=floor) st=' · <b class="simbad">MAX LOSS — stop</b>';
  el.innerHTML='£200 PLAN <span class="sub">day '+(priorDays+1)+'</span> · £'+fmt(eq)
    +' <span class="sub">vs plan £'+fmt(plan)+'</span> '
    +(eq>=plan?'<b style="color:var(--green)">✓</b>':'<b class="simbad">behind</b>')
    +' · today <b style="color:'+(todayNet>=0?'var(--green)':'var(--red)')+'">'+(todayNet>=0?'+':'−')+'£'+fmt(Math.abs(todayNet))+'</b>'
    +' <span class="sub">/ goal £'+fmt(goal)+'</span>'+st;
  el.hidden=false;
  const ns=todayNet>=goal?'goal':todayNet<=floor?'loss':'';
  if(ns&&ns!==_planState){ const tt=$('toast');
    tt.textContent=ns==='goal'?'🎯 GOAL +£'+fmt(todayNet)+' — computer OFF. The curve compounds.':'MAX LOSS — computer OFF. Tomorrow resets.';
    tt.classList.add('show'); setTimeout(()=>tt.classList.remove('show'),3200);
    if(navigator.vibrate) navigator.vibrate(ns==='goal'?[40,40,40]:[80,60,80]); }
  _planState=ns;
}
renderPlan(); setInterval(renderPlan, 30000);

// ================= ARM → FILLED → I'M OUT (expert package, 18 Jul) =================
// Pre-trade declaration is the law: ARM pins the planned trade before you touch T212.
// DECLARE logs a pick you're not trading (the honest test of "I find them early").
// FILLED flips to the in-trade takeover (timer, give-back, alarms). I'M OUT logs the
// round trip with a discipline chip. Losing trade => 5-min cool-down. Goal / max-loss
// => full-screen day-end takeover with streak; "continue anyway" is journaled.
let ARM=null; try{ ARM=JSON.parse(localStorage.getItem('arm_v1')||'null'); }catch(e){}
let DECL=[]; try{ DECL=JSON.parse(localStorage.getItem('decl_v1')||'[]'); }catch(e){}
let COOL=0; try{ COOL=+localStorage.getItem('cool_v1')||0; }catch(e){}
function armSave(){ try{ localStorage.setItem('arm_v1',JSON.stringify(ARM)); localStorage.setItem('decl_v1',JSON.stringify(DECL.slice(-300))); localStorage.setItem('cool_v1',String(COOL)); }catch(e){} }
function tost(m,vib){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); if(vib&&navigator.vibrate) navigator.vibrate(vib); }
function netNow(entry,px,sh){ return ((sh*px*(1-S)-sh*T)*(1-F)-sh*entry*(1+F))/GBPUSD; }

function declarePick(traded){
  const z=window._lastZone; if(!z||z.sym!==liveSym){ tost('Zone not ready'); return null; }
  const d={d:new Date().toISOString(), sym:z.sym, px:parseFloat($('cur').value)||null,
           zone:z.zone, stop:z.stop, target:z.target, traded:!!traded};
  DECL.push(d); armSave(); if(typeof syncJournal==='function') syncJournal();
  return d;
}
function armTrade(){
  if(Date.now()<COOL){ tost('Cooling down — no entries for '+Math.ceil((COOL-Date.now())/60000)+' min'); return; }
  const z=window._lastZone; if(!z||z.sym!==liveSym){ tost('Zone not ready'); return; }
  declarePick(true);
  ARM={state:'armed', sym:z.sym, zone:z.zone, stop:z.stop, target:z.target, tenNet:z.tenNet,
       fresh:!!z.fresh, declaredAt:new Date().toISOString()};
  if(etSession()!=='RTH') tost('⚠ Extended hours: T212 can NOT rest a stop — half size, sell-limit pre-typed', [60,40,60]);
  armSave(); renderArm();
}
function cancelArm(){ ARM=null; armSave(); renderArm(); }
function fillArm(){
  const px=parseFloat($('avg').value)||parseFloat($('cur').value)||ARM.zone;
  let sh=parseFloat($('shares').value);
  if(!(sh>0)){ const eq=(typeof PLAN!=='undefined'?PLAN.eq0:200)+loadTrades().filter(x=>x.d.slice(0,10)>=PLAN.start).reduce((a,x)=>a+x.netGBP,0);
               sh=Math.max(1,Math.floor(eq*(GBPUSD||1.3)/px)); $('shares').value=sh; }
  $('avg').value=px;
  ARM.state='in'; ARM.fillPx=px; ARM.sh=sh; ARM.filledAt=new Date().toISOString(); ARM.peak=px;
  armSave(); renderArm();
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  tost('IN — timer running. Stop $'+ARM.stop+' · target $'+ARM.target);
}
function exitArm(){
  const px=parseFloat($('cur').value)||ARM.target;
  const g=netNow(ARM.fillPx,px,ARM.sh);
  window._pendingTrade={d:new Date().toISOString(), sym:ARM.sym, entry:ARM.fillPx, exit:px, sh:ARM.sh,
    netGBP:+g.toFixed(2), sess:etSession()||'', decl:1, fresh:ARM.fresh?1:0,
    heldSec:Math.round((Date.now()-new Date(ARM.filledAt).getTime())/1000),
    peakPct:+(((ARM.peak-ARM.fillPx)/ARM.fillPx)*100).toFixed(2)};
  $('chipsBox').style.display='flex';
}
function finishTrade(tag){
  const tr=window._pendingTrade; if(!tr) return;
  tr.tag=tag||'';
  const t=loadTrades(); t.push(tr);
  try{ localStorage.setItem('trades', JSON.stringify(t.slice(-500))); }catch(e){}
  $('chipsBox').style.display='none'; window._pendingTrade=null;
  if(tr.netGBP<0){ COOL=Date.now()+5*60*1000; }
  ARM=null; armSave();
  $('avg').value=''; $('shares').value=''; $('stop').value='';
  try{ savePosition(); }catch(e){}
  calc(); renderDayLog(); renderPlan(); if(typeof syncJournal==='function') syncJournal();
  renderArm();
  tost('Logged: '+(tr.netGBP>=0?'+':'−')+'£'+fmt(Math.abs(tr.netGBP))+(tag?' · '+tag:''), 30);
}

function renderArm(){
  const al=$('armLine'), it=$('inTrade');
  const inTrade=!!(ARM&&ARM.state==='in');
  document.body.classList.toggle('intrade', inTrade);
  if(!ARM){ al.hidden=true; it.hidden=true; return; }
  if(ARM.state==='armed'){
    it.hidden=true;
    al.innerHTML='ARMED <b>'+ARM.sym+'</b>'+(ARM.fresh?' <span class="rwarn">FRESH</span>':'')+' · zone $'+ARM.zone+' · stop $'+ARM.stop+' · 2:1 $'+ARM.target
      +' <button class="btn abtn afill" id="btnFilled">FILLED</button><button class="btn abtn" id="btnCancelArm">✕</button>'
      +'<br><span class="sub">buy on T212, then tap FILLED (adjust entry price box to your real fill first)</span>';
    al.hidden=false;
    $('btnFilled').onclick=fillArm; $('btnCancelArm').onclick=cancelArm;
  } else {
    al.hidden=true; it.hidden=false; renderInTrade();
  }
}
function renderInTrade(){
  const it=$('inTrade'); const o=ARM; if(!o||o.state!=='in'){ it.hidden=true; return; }
  const px=(liveSym===o.sym)?parseFloat($('cur').value):null;
  if(px&&px>o.peak){ o.peak=px; armSave(); }
  const held=Math.round((Date.now()-new Date(o.filledAt).getTime())/1000);
  const mm=Math.floor(held/60), ss=String(held%60).padStart(2,'0');
  const tcls=held<120?'tg':held<360?'ta':'tr';
  const ext=etSession()!=='RTH';
  const pl=px?netNow(o.fillPx,px,o.sh):null;
  const nowPct=px?((px-o.fillPx)/o.fillPx*100):null;
  const peakPct=(o.peak-o.fillPx)/o.fillPx*100;
  const gb=(peakPct>0&&nowPct!=null)?Math.max(0,peakPct-nowPct):0;
  // allowed give-back tightens as profit grows; extended hours = ruthless (no halt to save you)
  let allowed = peakPct>=10?12 : peakPct>=7?20 : peakPct>=5?30 : peakPct>=3?40 : 60;
  if(ext) allowed*=0.7;
  const used = allowed>0 ? Math.min(1, gb/allowed) : 0;
  const col = used<0.5?'var(--green)' : used<0.8?'#d9a520' : 'var(--red)';
  const atPeak = gb<0.3;
  const takeNow = px!=null && (peakPct>=10 || used>=1);
  const stopHit = px!=null && px<=o.stop;
  const barW=Math.round(used*100);
  const bigTxt = px==null ? 'switch to '+o.sym+' to manage'
    : atPeak ? 'AT PEAK +'+peakPct.toFixed(1)+'%'
    : '&#9660; '+gb.toFixed(1)+'% from peak <span class="ppk">(+'+peakPct.toFixed(1)+'%)</span>';
  it.innerHTML=
    '<div class="itop"><b>'+o.sym+'</b> '+o.sh+'sh @ $'+o.fillPx+' <span class="ttimer '+tcls+'">&#9201; '+mm+':'+ss+'</span>'
      +(ext?' <span class="extbadge">EXT · no halt · manual stop</span>':'')+'</div>'
    +'<div class="peakbig" style="color:'+(px==null?'#8a8577':col)+'">'+bigTxt+'</div>'
    +(px!=null?'<div class="fuel"><div class="fuelfill" style="width:'+barW+'%;background:'+col+'"></div></div>':'')
    +(px!=null?'<div class="stopdist" style="color:'+(((px-o.stop)/px*100)<0.8?'var(--red)':'#c98a3a')+'">▲ '+((px-o.stop)/px*100).toFixed(1)+'% to stop · risk £'+fmt(Math.abs(netNow(o.fillPx,o.stop,o.sh)))+'</div>':'')
    +'<div class="isub">'+(px!=null?'now '+(nowPct>=0?'+':'')+nowPct.toFixed(1)+'% · '+(pl>=0?'+':'&minus;')+'&pound;'+fmt(Math.abs(pl))+' · ':'')+'stop $'+o.stop+' · target $'+o.target+'</div>'
    +'<button class="btn iout'+(stopHit?' iostop':takeNow?' iotake':'')+'" id="btnOut">'
      +(stopHit?'&#128721; STOP HIT &rarr; LOG':takeNow?'&#127919; TAKE IT &rarr; LOG':'I\'M OUT &rarr; LOG')+'</button>';
  $('btnOut').onclick=exitArm;
  if(px!=null){
    if(stopHit&&!o._sb){ o._sb=1; tost('STOP HIT — SELL NOW on T212',[100,60,100,60,100]); } if(!stopHit) o._sb=0;
    if(takeNow&&!o._tb){ o._tb=1; tost(ext?'TAKE IT — no halt to save you':'TAKE IT — giving back the gain',[60,50,60,50,120]); } if(used<0.8) o._tb=0;
    if(held>360&&held<363) tost('6 min — edge window over',[60]);
  }
}
setInterval(()=>{
  if(!ARM) return;
  if(ARM.state==='in'){ renderInTrade(); return; }
  if(ARM.state==='armed'){
    if(!ARM.armedAt){ ARM.armedAt=Date.now(); armSave(); }
    if(Date.now()-ARM.armedAt>90000 && !ARM._nudged){ ARM._nudged=1; tost('Still in T212? If you filled, tap FILLED so the timer + stop alarm start',[60,40,60]); }
  }
},1000);

// ---- day-end takeover + streak ----
let _deShown='';
function dayStreak(){
  const t=loadTrades().filter(x=>x.d.slice(0,10)>=PLAN.start);
  const days={}; t.forEach(x=>{ const k=x.d.slice(0,10); days[k]=(days[k]||0)+x.netGBP; });
  const keys=Object.keys(days).sort();
  let eq=PLAN.eq0, streak=0;
  const goals=keys.map(k=>{ const g=days[k]>=eq*0.05-0.005; eq+=days[k]; return g; });
  for(let i=goals.length-1;i>=0;i--){ if(goals[i]) streak++; else break; }
  return streak;
}
function showDayEnd(kind, todayNet, eq){
  const id=new Date().toISOString().slice(0,10)+kind;
  if(_deShown===id) return; _deShown=id;
  const de=$('dayEnd');
  const tomorrow=(eq*1.05).toFixed(2);
  de.className='deover '+(kind==='goal'?'degood':'debad');
  de.innerHTML='<div class="debox"><div class="debig">'+(kind==='goal'?'🎯 DAY DONE':'STOPPED')+'</div>'
    +'<div class="denum">'+(todayNet>=0?'+':'−')+'£'+fmt(Math.abs(todayNet))+'</div>'
    +(kind==='goal'?'<div class="destreak">'+dayStreak()+' day streak at goal</div>':'<div class="destreak">−5% floor. Tomorrow resets.</div>')
    +'<div class="deplan">stop now → tomorrow\'s target £'+tomorrow+'</div>'
    +'<button class="btn deok" id="deOk">Computer OFF</button>'
    +'<button class="btn devi" id="deGo">Continue anyway (journaled)</button></div>';
  de.style.display='flex';
  $('deOk').onclick=()=>{ de.style.display='none'; };
  $('deGo').onclick=()=>{ de.style.display='none';
    DECL.push({d:new Date().toISOString(), type:'plan-deviation', kind:kind}); armSave();
    if(typeof syncJournal==='function') syncJournal();
    tost('Deviation journaled — Claude will see it.'); };
}
// hook into plan state transitions
const _origRenderPlan=renderPlan;
renderPlan=function(){
  _origRenderPlan();
  if(_planState){
    const t=loadTrades().filter(x=>x.d.slice(0,10)>=PLAN.start);
    const today=new Date().toISOString().slice(0,10);
    const todayNet=t.filter(x=>x.d.slice(0,10)===today).reduce((a,x)=>a+x.netGBP,0);
    const eq=PLAN.eq0+t.reduce((a,x)=>a+x.netGBP,0);
    showDayEnd(_planState, todayNet, eq);
  }
};
document.querySelectorAll('.dchip').forEach(b=>b.addEventListener('click',()=>finishTrade(b.dataset.t)));
renderArm();
// ---- journal sync: mirrors the LOG journal to a tiny cloud doc so Claude can read the calculator ----
const SYNC_URL='https://profit-sync-ali-default-rtdb.firebaseio.com/j/ali-q7x2mk.json';
function syncJournal(){
  try{ fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({t:loadTrades().slice(-300), plan:PLAN, decl:(typeof DECL!=='undefined'?DECL.slice(-300):[]), up:new Date().toISOString()})}).catch(()=>{}); }catch(e){}
}
setTimeout(syncJournal, 4000);
