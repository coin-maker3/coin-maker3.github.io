<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Trade Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Space Grotesk (UI) + JetBrains Mono (numerals — dotted zero, tall x-height: digit
     misreads are the costliest error here). Non-blocking with display=swap; the stack
     falls back to system-ui, so a dead network costs appearance only, never function. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ============ OLED PRECISION HUD — expert design spec 20 Jul 2026 ============
   Deep OLED blue-black layers, hairline borders (no card shadows), JetBrains Mono
   tabular numerals for every figure, ONE cyan live accent. Semantic colour is law:
   green=profit, red=loss, amber=caution, cyan=live. Exactly three glows allowed
   (live badge, positive hero, GET OUT border). No blur, no neon soup, no number
   animation — steady numerals read fastest under adrenaline. */
:root{
  --bg-0:#05080F; --bg-1:#0A101C; --surface-1:#0F1726; --surface-2:#16203A;
  --border-hair:rgba(148,163,184,.10); --border-strong:rgba(148,163,184,.22);
  --text-hi:#F1F5F9; --text-mid:#94A3B8; --text-low:#5B6B84;
  --pos:#34D399; --pos-dim:rgba(52,211,153,.12); --pos-border:rgba(52,211,153,.35);
  --neg:#F87171; --neg-dim:rgba(248,113,113,.10); --neg-border:rgba(248,113,113,.35);
  --neg-hard:#EF4444; --warn:#FBBF24; --warn-dim:rgba(251,191,36,.10); --warn-border:rgba(251,191,36,.35);
  --live:#22D3EE; --live-dim:rgba(34,211,238,.10); --stale:#64748B;
  --glow-live:0 0 12px rgba(34,211,238,.30); --glow-pos:0 0 14px rgba(52,211,153,.22);
  --glow-neg:0 0 16px rgba(239,68,68,.30); --shadow-toast:0 8px 24px rgba(0,0,0,.5);
  --font-ui:'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-num:'JetBrains Mono','Cascadia Mono','Roboto Mono',ui-monospace,monospace;
  /* legacy aliases so existing rules keep meaning */
  --bg:var(--bg-0); --card:var(--surface-1); --field:var(--bg-1); --line:var(--border-hair);
  --text:var(--text-hi); --muted:var(--text-mid); --muted2:var(--text-low);
  --green:var(--pos); --green2:#10B981; --red:var(--neg); --amber:var(--warn);
}
*{box-sizing:border-box}
html{background:var(--bg-0);overscroll-behavior:none}
body{font-family:var(--font-ui);background:var(--bg-0);color:var(--text-hi);margin:0;
  height:100dvh;overflow:hidden;display:flex;justify-content:center;overscroll-behavior:none}
main{width:100%;max-width:460px;display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.2px}

/* ---------- tab shell: content region + fixed bottom bar (thumb arc) ---------- */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:10px 16px calc(8px + env(safe-area-inset-bottom,0px));gap:10px}
@media (max-width:379px){.panel{padding-left:14px;padding-right:14px}}
body.tab-manage #findPanel{display:none}
body:not(.tab-manage) #managePanel{display:none}
.panel.enter{animation:pin 180ms cubic-bezier(.2,0,0,1)}
@keyframes pin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.spacer{flex:1;min-height:0}
.tabbar{flex:none;height:calc(56px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--bg-1);
  border-top:1px solid var(--border-hair)}
.tab{flex:1;background:none;border:none;color:var(--text-low);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-family:var(--font-ui);font-size:11px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:relative;padding:0}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--text-hi)}
.tab .bar{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;
  border-radius:2px;background:transparent;transition:background 180ms}
.tab.on .bar{background:var(--live);box-shadow:var(--glow-live)}
.tab .tdot{position:absolute;top:8px;right:calc(50% - 34px);width:7px;height:7px;border-radius:50%;
  background:var(--pos);display:none}
.tab .tdot.show{display:block}
body:not(.tab-manage) .tab .tdot.show{animation:dotpulse 1.6s infinite}
@keyframes dotpulse{50%{opacity:.4}}
.tab:active{transform:scale(.97)}

/* ---------- inputs & buttons ---------- */
.tickrow{display:flex;gap:8px;flex:none}
.tickrow input{flex:1;text-transform:uppercase}
input[type=text],input[type=number]{background:var(--bg-1);border:1px solid var(--border-hair);
  border-radius:12px;color:var(--text-hi);font-size:17px;font-family:var(--font-num);
  font-variant-numeric:tabular-nums;padding:0 12px;outline:none;width:100%;min-height:48px}
input:focus{border-color:var(--border-strong);box-shadow:0 0 0 3px var(--live-dim)}
input::placeholder{color:var(--text-low);font-size:13px;font-family:var(--font-ui)}
.btn{background:var(--surface-2);border:1px solid var(--border-hair);border-radius:12px;
  color:var(--text-hi);font-family:var(--font-ui);font-size:14px;font-weight:700;padding:0 14px;
  cursor:pointer;min-height:44px;transition:transform 100ms}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--live-dim);border:1px solid var(--live);color:var(--live);
  text-transform:uppercase;letter-spacing:.04em;min-width:96px}
.btn:disabled{opacity:.5}

/* ---------- price hero (corner-tick HUD panel) ---------- */
.hero{background:var(--surface-1);border:1px solid var(--border-hair);border-radius:16px;
  padding:10px 14px;position:relative;flex:none}
.hero::before,.hero::after{content:'';position:absolute;width:8px;height:8px;pointer-events:none}
.hero::before{top:-1px;left:-1px;border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong)}
.hero::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--border-strong);border-right:1px solid var(--border-strong)}
.bigprice{font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:clamp(40px,12vw,50px);font-weight:700;letter-spacing:-.02em;line-height:1.05;
  text-align:center;min-height:46px;color:var(--text-hi)}
.bigprice.up{color:var(--pos)}.bigprice.down{color:var(--neg)}
body.plpos #mPrice{text-shadow:var(--glow-pos)}
.quote{font-size:12px;text-align:center;min-height:16px;color:var(--text-mid);margin-top:2px;font-family:var(--font-ui)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.06em;color:var(--live);background:var(--live-dim);border-radius:999px;padding:2px 9px}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:var(--glow-live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.live.stale{color:var(--warn);background:var(--warn-dim)}
.live.stale .dot{background:var(--warn);box-shadow:none;animation:none}
.err{color:var(--neg)}

/* ---------- FIND: market temp / gauge / rhythm / walls ---------- */
#mktLine{font-size:12px;color:var(--text-low);flex:none;white-space:nowrap;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:20px}
#mktLine::-webkit-scrollbar{display:none}
#mktLine b.hot{color:var(--pos)}#mktLine b.warm{color:var(--warn)}#mktLine b.cold{color:var(--text-low)}
.mfade{color:var(--text-low)}.mlive{color:var(--pos)}
#mktLine .msym{color:var(--text-mid);text-decoration:underline dotted;cursor:pointer;margin-left:6px}
.gbadge{text-align:center;font-family:var(--font-ui);font-size:20px;font-weight:700;
  letter-spacing:.04em;border-radius:12px;padding:5px 0;margin:0 0 6px}
.gbadge.strong{background:var(--pos-dim);color:var(--pos);border:1px solid var(--pos-border)}
.gbadge.medium{background:var(--warn-dim);color:var(--warn);border:1px solid var(--warn-border)}
.gbadge.weak{background:none;color:var(--text-mid);border:1px solid var(--border-hair)}
.gbadge.loading{background:none;color:var(--text-mid);border:1px dashed var(--border-hair);font-weight:600;letter-spacing:.02em;font-size:13px}
.gbadge.stalegrade{opacity:.72;border-style:dashed}
.gstamp{flex-basis:100%;color:var(--text-low);font-size:10.5px;letter-spacing:.4px;margin-bottom:1px}
.greasons{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.greasons span{flex:none;font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 9px;
  background:var(--bg-1);border:1px solid var(--border-hair);color:var(--text-low);white-space:nowrap;font-family:var(--font-ui)}
.greasons span.ok{color:var(--pos);border-color:var(--pos-border);background:var(--pos-dim)}
.greasons span.bad{color:var(--neg);border-color:var(--neg-border)}
.greasons span.warn{color:var(--warn);border-color:var(--warn-border)}
#entryLine{font-size:13px;color:var(--text-mid);border-left:3px solid var(--live);
  background:var(--surface-1);border-radius:0 12px 12px 0;padding:8px 10px;line-height:1.5;flex:none}
#entryLine b{color:var(--text-hi)}
#wallLine{font-size:11.5px;color:var(--text-mid);padding:0 8px;flex:none}
#wallLine b{color:var(--warn)}
.rok{color:var(--pos)}.rbad{color:var(--neg)}.rwarn{color:var(--warn)}
.abtn{padding:0 16px;margin-left:8px;font-size:13px;min-height:44px}
.afill{border:1px solid var(--border-strong);background:transparent;color:var(--text-hi)}

/* ---------- recents chips ---------- */
.recents{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;min-height:40px;flex:none;align-items:center;padding-top:6px}
.recents::-webkit-scrollbar{display:none}
.recents button{flex:none;position:relative;background:var(--surface-1);border:1px solid var(--border-hair);
  color:var(--text-hi);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
  letter-spacing:.03em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--font-ui)}
.recents button .del{position:absolute;top:-9px;right:-7px;background:var(--neg-hard);color:#fff;
  border-radius:999px;font-size:10px;font-weight:700;padding:2px 8px;border:2px solid var(--bg-0);z-index:2}
.recents button .setup{position:absolute;top:-8px;left:-5px;background:var(--warn);color:#3a2a00;
  border-radius:999px;font-size:8.5px;font-weight:700;letter-spacing:.4px;padding:1.5px 6px;
  border:2px solid var(--bg-0);animation:setpop 250ms ease-out}
@keyframes setpop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.recents button.on{border-color:var(--border-strong);background:var(--surface-2)}

/* ---------- MANAGE: P/L block (£ and % EQUAL — the owner's ask) ---------- */
.pl{display:flex;align-items:stretch;border-radius:14px;border:1px solid var(--border-hair);
  background:var(--surface-1);min-height:64px;flex:none}
.pl>span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 0}
.pl>span:first-child{border-right:1px solid var(--border-hair)}
.plcap{font-size:11px;color:var(--text-mid);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-family:var(--font-ui)}
.pl .amt,.pl .pct{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;line-height:1.1}
.pl.up{background:var(--pos-dim);border-color:var(--pos-border)}
.pl.down{background:var(--neg-dim);border-color:var(--neg-border)}
.pl.up .amt,.pl.up .pct{color:var(--pos)}
.pl.down .amt,.pl.down .pct{color:var(--neg)}
.lbl{font-size:11px;color:var(--text-mid);text-transform:uppercase;letter-spacing:.08em;font-weight:600;flex:none;margin:2px 0 0}
.entry{display:flex;gap:8px;flex:none}
.entry input{flex:1}
.be{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--text-mid);
  font-size:12px;font-weight:600;min-height:22px;flex:none;border-bottom:1px solid var(--border-hair);padding-bottom:4px}

/* ---------- sell-target cards ---------- */
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.tcard{border-radius:14px;padding:8px 12px;border:1px solid var(--border-hair);background:var(--surface-1);
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;min-height:64px;
  text-align:left;color:var(--text-hi);transition:transform 100ms,border-color 300ms;min-width:0;overflow:hidden}
.tcard:active{transform:scale(.97)}
.tcard.copied{border-color:var(--live)}
.tcard .pct{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-mid);font-family:var(--font-ui)}
.tcard .price{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:20px;
  font-weight:700;letter-spacing:-.4px;color:var(--text-hi);line-height:1.1}
.tcard .prof{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.tcard .prof .gbp{font-family:var(--font-num);font-size:12.5px;font-weight:700}
.tcard .prof .usd{font-family:var(--font-num);font-size:9.5px;color:var(--text-mid)}
.tcard .hint{display:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.tcard.t5{border-color:var(--pos-border)}
.tcard.t5 .pct{color:var(--pos)}
.tcard.t5 .prof .gbp{color:var(--pos)}
.tcard.t10 .prof .gbp{color:var(--pos)}
.ghosts{display:flex;gap:8px;justify-content:center;flex:none}
.ghost{background:none;border:1px solid var(--border-hair);color:var(--text-mid);border-radius:999px;
  padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px;font-family:var(--font-ui)}
.ghost.on{border-color:var(--border-strong);color:var(--text-hi);background:var(--surface-2)}
.daylog{text-align:center;color:var(--text-mid);font-size:11.5px;font-weight:600;cursor:pointer;flex:none}
.daylog b{color:var(--text-hi)}
.simline{font-size:12.5px;color:var(--text-mid);text-align:center;flex:none}
.simline .sub{color:var(--text-low);font-size:11px}
.simbad{color:var(--neg)}

/* ---------- ARMED line + in-trade EXIT COACH panel ---------- */
#armLine{border-left:3px solid var(--pos);background:var(--surface-1);border-radius:0 12px 12px 0;
  padding:8px 10px;font-size:13px;flex:none;line-height:1.6}
#armLine .sub,.isub .sub{color:var(--text-low);font-size:11px}
#inTrade{background:var(--surface-1);border:1px solid var(--border-hair);border-radius:16px;
  padding:10px 12px;position:relative;flex:none}
#inTrade::before,#inTrade::after{content:'';position:absolute;width:8px;height:8px;pointer-events:none}
#inTrade::before{top:-1px;left:-1px;border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong)}
#inTrade::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--border-strong);border-right:1px solid var(--border-strong)}
.itop{font-size:14px;color:var(--text-mid);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.itop b{color:var(--text-hi)}
.ttimer{font-family:var(--font-num);font-weight:700;margin-left:auto}
.tg{color:var(--pos)}.ta{color:var(--warn)}.tr{color:var(--neg)}
.peakbig{text-align:center;margin:8px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.peakbig .peaklab{font-size:12px;font-weight:600;color:var(--text-mid);letter-spacing:.03em}
.peakbig .peaknum{font-family:var(--font-num);font-size:38px;font-weight:700;letter-spacing:-1.5px;line-height:1.02;white-space:nowrap}
.peakbig .ppk{font-size:13px;font-weight:600;color:var(--text-mid)}
.peakbig .peaksmall{font-size:14px;font-weight:600;color:var(--text-low)}
.fuel{height:10px;background:var(--bg-1);border-radius:999px;overflow:hidden;margin:10px 2px 6px}
.fuelfill{height:100%;transition:width 300ms linear}
.isub{font-size:12.5px;color:var(--text-mid);text-align:center;margin:4px 0;font-family:var(--font-num)}
.extbadge{font-size:10px;color:var(--warn);border:1px solid var(--warn-border);border-radius:5px;padding:2px 6px;font-weight:700;flex:none}
.extwarn{font-size:11px;color:var(--warn);text-align:center;background:var(--warn-dim);
  border:1px solid var(--warn-border);border-radius:8px;padding:4px 8px;margin-top:6px}
.iout{width:100%;padding:14px;margin-top:10px;border:1px solid var(--neg-border);color:var(--neg);
  font-weight:700;font-size:16px;letter-spacing:.03em;background:var(--neg-dim);border-radius:12px}
.iotake{border-color:var(--pos)!important;color:var(--pos)!important;background:var(--pos-dim)!important;animation:pulseb .7s infinite}
.iostop{border-color:var(--neg-hard)!important;color:var(--neg-hard)!important;animation:pulseb .5s infinite}
@keyframes pulseb{50%{opacity:.55}}

/* ---------- 3-stage loss advisor ---------- */
.advline{border-radius:10px;padding:7px 10px;font-size:13.5px;line-height:1.45;margin:6px 0 2px;font-family:var(--font-ui)}
.advline.a0{color:var(--text-mid);border-left:3px solid var(--border-strong)}
.advline.a1{color:var(--text-mid);border-left:3px solid var(--warn);background:none}
.advline.a1::first-line{color:var(--warn)}
.advline.a2{color:var(--text-hi);background:var(--neg-dim);border:1px solid var(--neg-border);
  animation:hb 2s infinite}
@keyframes hb{50%{border-color:rgba(248,113,113,.8)}}
.advline b{font-family:var(--font-num)}
.advgo{background:rgba(239,68,68,.16);border:2px solid var(--neg-hard);box-shadow:var(--glow-neg);
  border-radius:16px;padding:12px;text-align:center;font-size:17px;font-weight:700;color:var(--neg-hard);
  letter-spacing:.02em;margin:8px 0 4px;line-height:1.4;animation:gopulse 1.2s infinite}
.advgo b{font-family:var(--font-num);color:#fff;font-size:19px}
@keyframes gopulse{50%{opacity:.86}}

/* ---------- discipline chips modal + day-end + toast ---------- */
#chipsBox{position:fixed;inset:0;background:rgba(3,5,10,.85);z-index:60;align-items:center;justify-content:center}
.chipwrap{display:flex;flex-direction:column;gap:10px;width:78%;max-width:320px}
.chiphead{color:var(--text-mid);font-weight:600;text-align:center;font-size:15px}
.dchip{padding:13px;font-size:15px}.dskip{opacity:.6}
.deover{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center}
.degood{background:rgba(6,38,24,.97)}.debad{background:rgba(52,12,12,.97)}
.debox{text-align:center;width:82%}
.debig{font-size:28px;font-weight:700;color:#fff;font-family:var(--font-ui)}
.denum{font-family:var(--font-num);font-size:44px;font-weight:700;margin:8px 0;color:#fff}
.destreak{font-size:16px;color:#d9e5dc;margin:6px 0}
.deplan{font-size:14px;color:#aab8ae;margin:10px 0}
.deok{width:100%;padding:15px;font-size:17px;font-weight:700;margin-top:8px}
.devi{width:100%;padding:9px;font-size:12px;opacity:.55;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--surface-2);
  color:var(--text-hi);border:1px solid var(--border-strong);box-shadow:var(--shadow-toast);
  font-weight:600;font-size:13px;border-radius:999px;padding:12px 20px;opacity:0;pointer-events:none;
  transition:opacity 200ms,transform 200ms;z-index:90;white-space:nowrap;max-width:calc(100% - 32px);
  overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
a{color:var(--text-mid);text-decoration:none}

/* While the QUICK-trade coach is up it already shows the targets and live P/L —
   the sell cards / ghosts / BE strip below would be duplication that squeezes the
   coach on short phones. P/L block stays (the owner's equal-£/% ask). */
body.incoach .cardgrid,body.incoach .ghosts,body.incoach .be,body.incoach .lbl,body.incoach #posRow,
body.incoach #dayLog,body.incoach #planLine{display:none}
/* VERIFIER FIX 1: .pl/.be author display rules beat the UA [hidden] rule — they never hid */
.pl[hidden],.be[hidden]{display:none}
/* VERIFIER FIX 2: if an extreme coach state (GET OUT + EXT warning) still exceeds the panel,
   scroll it rather than clip the exit row off-screen — reachability beats aesthetics */
#managePanel{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#managePanel::-webkit-scrollbar{display:none}

/* ---------- compact height class (360×740-class phones) ---------- */
@media (max-height:780px){
  .panel{gap:8px;padding-top:8px}
  .bigprice{font-size:clamp(36px,11vw,44px);min-height:42px}
  .hero{padding:8px 12px}
  .pl{min-height:56px}
  .pl .amt,.pl .pct{font-size:26px}
  .tcard{min-height:52px;padding:6px 10px}
  .peakbig .peaknum{font-size:32px}

<script>
const $ = id => document.getElementById(id);

// ================= TAB SHELL — FIND (hunt) · MANAGE (the active trade) =================
// Auto-switches to MANAGE when a trade goes live (Ali's pick); dot on the MANAGE tab
// whenever a position is open. Panels are display-toggled (cheapest); the incoming
// panel replays a 180ms slide via the .enter class.
function switchTab(t){
  const toManage = t==='manage';
  if(document.body.classList.contains('tab-manage')===toManage){ paintTabs(); return; }
  document.body.classList.toggle('tab-manage', toManage);
  const inc=$(toManage?'managePanel':'findPanel');
  inc.classList.remove('enter'); void inc.offsetWidth; inc.classList.add('enter');
  paintTabs();
  try{ localStorage.setItem('tab_v1', t); }catch(e){}
}
function paintTabs(){
  const m=document.body.classList.contains('tab-manage');
  $('tabFind').classList.toggle('on', !m);
  $('tabManage').classList.toggle('on', m);
}
function updateTabDot(){
  // try/catch: ARM is a `let` declared later — typeof still throws in the TDZ window
  let arm=null; try{ arm=ARM; }catch(e){}
  const has = !!arm || (parseFloat($('avg').value)>0 && parseFloat($('shares').value)>0);
  $('tabDot').classList.toggle('show', has);
}
$('tabFind').addEventListener('click', ()=>switchTab('find'));
$('tabManage').addEventListener('click', ()=>switchTab('manage'));

// ---- Trading 212 UK Invest (GBP) real costs — verified July 2026, silent by design ----
// FX fee 0.15% each way (baked into T212's rate) · SEC 0.00278% of sell value ·
// FINRA TAF $0.000195/share sold. Commission zero. FX rate cancels for % targets:
//   P_sell = ( P_buy·(1+x)·(1+f)/(1−f) + t ) / (1−s), then round UP to the cent.
// Unit tests: buy $10.00 → +5% limit $10.54 · +10% limit $11.04 · break-even $10.04.
const F = 0.0015, S = 0.0000278, T = 0.000195;
function limitFor(buy, x){
  const raw = (buy * (1 + x) * (1 + F) / (1 - F) + T) / (1 - S);
  return Math.ceil(raw * 100 - 1e-9) / 100;
}
function breakEven(buy){ return limitFor(buy, 0); }

// ---- state persistence (per-device) ----
const FIELDS = ['ticker'];
try {
  const saved = JSON.parse(localStorage.getItem('profit_state_v3') || '{}');
  FIELDS.forEach(id => { if (saved[id] != null && saved[id] !== '' && !$(id).value) $(id).value = saved[id]; });
} catch(e){}
function saveState(){
  try { const s = {}; FIELDS.forEach(id => s[id] = $(id).value);
        localStorage.setItem('profit_state_v3', JSON.stringify(s)); } catch(e){}
}
FIELDS.forEach(id => $(id).addEventListener('input', () => { saveState(); calc(); }));

// ---- PER-SYMBOL positions: your entry belongs to ONE stock. Switching symbols
// shows THAT symbol's saved entry/shares/stop (or blanks) — never yesterday's
// numbers against another stock's price (the "massive fake gain" bug).
const POS_FIELDS = ['avg','shares'];   // stop/risk removed (Ali 20 Jul — he cuts losses manually)
function loadPositions(){ try { return JSON.parse(localStorage.getItem('positions_v1') || '{}'); } catch(e){ return {}; } }
function savePosition(){
  if (!liveSym) return;
  const pos = loadPositions();
  const v = {};
  let any = false;
  POS_FIELDS.forEach(id => { v[id] = $(id).value; if (v[id] !== '') any = true; });
  if (any) pos[liveSym] = v; else delete pos[liveSym];
  try { localStorage.setItem('positions_v1', JSON.stringify(pos)); } catch(e){}
}
function applyPosition(sym){
  const v = loadPositions()[sym] || {};
  POS_FIELDS.forEach(id => { $(id).value = v[id] || ''; });
}
POS_FIELDS.forEach(id => $(id).addEventListener('input', () => { savePosition(); calc(); }));

// ---- GBP/USD for the £ profit figures (silent; falls back to $-only) ----
let GBPUSD = null, FX_AT = 0;                      // FX_AT: when the rate was fetched
// A cable rate from six hours ago is not a rate. Everything money-shaped checks this.
function fxFresh(){ return GBPUSD > 0 && FX_AT > 0 && (Date.now() - FX_AT) < 6*3600e3; }
async function refreshFx(){
  try {   // live-ish cable via Yahoo (proxy race) — ECB daily ref can lag 0.3-0.5%
    const res = await fetchCandles('GBPUSD=X');
    const r = res && res.meta && res.meta.regularMarketPrice;
    if (r > 0){ GBPUSD = r; FX_AT = Date.now(); calc(); return; }
  } catch(e){}
  try {
    const r = await fetch('https://api.frankfurter.dev/v1/latest?base=GBP&symbols=USD', {signal: AbortSignal.timeout(6000)});
    const j = await r.json();
    if (j && j.rates && j.rates.USD){ GBPUSD = j.rates.USD; FX_AT = Date.now(); calc(); }
  } catch(e){}
}
setTimeout(refreshFx, 800); setInterval(refreshFx, 300000);

// ---- live price: Finnhub quote + WebSocket stream, Yahoo/proxy fallback ----
// Finnhub free /quote FREEZES at the 16:00 ET close (its t stops moving), so outside
// regular hours we pull the last 1-min extended print from Yahoo (includePrePost)
// and label it honestly: PRE-MKT / AFTER-HRS / LAST CLOSE. Verified 13 Jul 2026:
// AAPL after-hours — Finnhub c stuck 115 min, Yahoo 1m candle 0 min old.
const FINNHUB_KEY = 'd9afnh1r01qg31s4h340d9afnh1r01qg31s4h34g';
let extCache = { sym: null, at: 0, p: 0, tag: '' };            // 8s cache so 3s polling doesn't hammer proxies
async function fetchExtended(symbol){
  if (extCache.sym === symbol && Date.now() - extCache.at < 8000 && extCache.p > 0) return extCache;
  // &cb= busts PROXY-side caching: corsproxy/allorigins serve the identical URL from
  // cache for minutes (proven 13 Jul 2026: same candle returned 75s apart plain; fresh with cb)
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(symbol) + '?range=1d&interval=1m&includePrePost=true&cb=' + Date.now();
  for (const wrap of [u => u, u => 'https://corsproxy.io/?url=' + encodeURIComponent(u), u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)]){
    try {
      const j = await jget(wrap(url), 8000);          // 8s cap — a hung proxy socket must not stall the poll pipeline
      const res = j?.chart?.result?.[0];
      if (!res){ if (j?.chart?.error) break; continue; }
      const ts = res.timestamp || [], cl = res.indicators?.quote?.[0]?.close || [];
      let i = cl.length - 1;
      while (i >= 0 && cl[i] == null) i--;
      if (i < 0 || !(cl[i] > 0)){                              // no candles — old regular-hours fallback
        const p = res.meta && res.meta.regularMarketPrice;
        if (p > 0){ extCache = { sym: symbol, at: Date.now(), p: p, tag: '' }; return extCache; }
        break;
      }
      const ageH = (Date.now() / 1000 - ts[i]) / 3600;
      const reg = res.meta && res.meta.currentTradingPeriod && res.meta.currentTradingPeriod.regular;
      let tag = '';
      if (ageH > 4) tag = 'LAST CLOSE';                        // weekend / overnight — nothing printing
      else if (reg && ts[i] < reg.start) tag = 'PRE-MKT';
      else if (reg && ts[i] >= reg.end)  tag = 'AFTER-HRS';
      extCache = { sym: symbol, at: Date.now(), p: cl[i], tag: tag };
      return extCache;
    } catch(e){}
  }
  // all proxies down this cycle: a recent extended print beats reverting to the
  // hours-old frozen close (which would move the shown price BACKWARDS)
  if (extCache.sym === symbol && extCache.p > 0 && Date.now() - extCache.at < 600000) return extCache;
  return null;
}
async function fetchQuote(symbol){
  let fhClose = 0;
  try {
    // 6s cap — this was the ONLY fetch in the app with no timeout. When a stock HALTS
    // (ZYBT, 18 Jul) or the cell signal drops, Finnhub's socket hangs open; a new hung
    // request fired every 3s exhausted the browser's ~6-connection pool and froze the
    // WHOLE app ("stuck, press anything and it hangs"). Now it aborts and falls through
    // to the Yahoo extended path, so the price keeps flowing and the button re-enables.
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 6000);
    let r;
    try { r = await fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(symbol) + '&token=' + FINNHUB_KEY, {signal: ctl.signal}); }
    finally { clearTimeout(tm); }
    if (r.ok){
      const j = await r.json();
      if (j && typeof j.c === 'number' && j.c > 0){
        // a MISSING timestamp is not evidence of freshness - it used to short-circuit to
        // "LIVE (3s)" and skip the whole extended-hours path built to avoid exactly that
        if (j.t && Date.now() / 1000 - j.t < 120) return { p: j.c, tag: '', asOf: j.t*1000 };
        fhClose = j.c;                                         // stale/unknown = treat as frozen close
      }
    }
  } catch(e){}
  const ext = await fetchExtended(symbol);
  if (ext && ext.p > 0) return { p: ext.p, tag: ext.tag, asOf: ext.at };
  if (fhClose > 0) return { p: fhClose, tag: 'LAST CLOSE' };
  throw new Error('no price');
}

let ws = null, pollTimer = null, liveSym = null, lastTickAt = 0, prevPrice = null, lastUpdateAt = 0, haltBuzzed = false;
let lastTag = '';
// one write → both tabs. The halt/stale warning used to paint only the FIND hero,
// leaving MANAGE (where he actually is mid-trade) with a lying green LIVE badge.
function setQuoteHtml(html){ $('quote').innerHTML = html; $('mQuote').innerHTML = html; }
function setPrice(price, tag, asOf){
  lastTag = tag || '';
  // asOf = when the PRINT happened, not when we drew it. Without this the staleness
  // watchdog can never fire while a cached price is being re-served every poll.
  const stamp = (asOf && asOf > 0 && asOf <= Date.now()) ? asOf : Date.now();
  if (stamp > lastUpdateAt) haltBuzzed = false;
  lastUpdateAt = stamp;
  if (window._simTickHook) window._simTickHook(price);
  $('cur').value = price;
  const bp = $('bigPrice');
  bp.textContent = '$' + price.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:4});
  bp.className = 'bigprice mono' + (prevPrice==null ? '' : price>prevPrice ? ' up' : price<prevPrice ? ' down' : '');
  prevPrice = price;
  const tagCls = tag.indexOf('LAST CLOSE') === 0 ? 'live stale' : 'live';   // frozen close must not glow green
  const qHtml = '<strong>' + liveSym + '</strong> <span class="' + tagCls + '"><span class="dot"></span>' + tag + '</span>';
  $('quote').innerHTML = qHtml;
  // mirror into the MANAGE hero — both tabs always show the truth
  $('mPrice').textContent = bp.textContent; $('mPrice').className = bp.className;
  $('mQuote').innerHTML = qHtml;
  saveState(); calc();
}
function stopLive(){
  if (ws){ try { ws.close(); } catch(e){} ws = null; }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
let _pollBusy = false;
function startPolling(sym){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    // hidden-tab polling stays OFF — except mid-QUICK-trade: he's in T212 executing, and the
    // advisor must keep computing so the ntfy push can still reach his notification tray
    if (document.hidden && !(ARM && ARM.state==='in' && ARM.mode!=='hold')) return;
    if (Date.now() - lastTickAt < 5000) return;        // stream healthy: don't double-write (no kill/restart flapping)
    if (_pollBusy) return;                             // a slow/halted fetch must never let 3s polls stack into a pile-up
    _pollBusy = true;
    try { const q = await fetchQuote(sym); if (q.p > 0 && sym === liveSym)
      // "(3s)" only when genuinely 3s-fresh; extended prints refresh ~every 10s post cache-bust
      setPrice(q.p, q.tag === '' ? 'LIVE (3s)' : q.tag === 'LAST CLOSE' ? q.tag : q.tag + ' ~10s', q.asOf); } catch(e){}
    finally { _pollBusy = false; }
  }, 3000);
}
function startStream(sym){
  stopLive();
  liveSym = sym; lastTickAt = 0;                       // per-symbol: old symbol's ticks must not mute the new one's poll
  try {
    ws = new WebSocket('wss://ws.finnhub.io?token=' + FINNHUB_KEY);
    ws.onopen = () => ws.send(JSON.stringify({type:'subscribe', symbol:sym}));
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'trade' && m.data && m.data.length){
          const t = m.data[m.data.length - 1];
          if (t.p > 0){
            lastTickAt = Date.now();                   // poll self-mutes while ticks flow — no kill/restart loop
            setPrice(t.p, 'LIVE');
          }
        }
      } catch(e){}
    };
    ws.onerror = () => startPolling(sym);
    ws.onclose  = () => { if (sym === liveSym && !pollTimer) startPolling(sym); };
    setTimeout(() => { if (Date.now() - lastTickAt > 8000 && sym === liveSym) startPolling(sym); }, 8000);
  } catch(e){ startPolling(sym); }
}
// ---- recent symbols: one-tap circle-back to anything searched before ----
function loadRecents(){ try { return JSON.parse(localStorage.getItem('recent_syms') || '[]'); } catch(e){ return []; } }
const chipSetup = {};   // sym -> true when the 4 momentum conditions align (see SETUP engine)
function clearDels(){ document.querySelectorAll('.recents .del').forEach(x => x.remove()); }
function removeRecent(sym){
  const l = loadRecents().filter(s => s !== sym);
  try { localStorage.setItem('recent_syms', JSON.stringify(l)); } catch(e){}
  renderRecents();
}
function renderRecents(){
  const el = $('recents');
  const list = loadRecents();
  el.innerHTML = list.map(s => '<button class="' + (s === liveSym ? 'on' : '') + '" data-s="' + s + '">' + s +
    (chipSetup[s] ? '<span class="setup">SETUP</span>' : '') + '</button>').join('');
  el.querySelectorAll('button').forEach(b => {
    const sym = b.dataset.s;
    let timer = null, long = false;
    const start = () => { long = false; timer = setTimeout(() => {   // long-press -> DELETE bubble
      long = true; clearDels();
      const d = document.createElement('span'); d.className = 'del'; d.textContent = 'DELETE';
      d.onclick = (ev) => { ev.stopPropagation(); removeRecent(sym); };
      b.appendChild(d);
      if (navigator.vibrate) navigator.vibrate(20);
    }, 550); };
    const cancel = () => { if (timer){ clearTimeout(timer); timer = null; } };
    b.addEventListener('pointerdown', start);
    b.addEventListener('pointerup', cancel);
    b.addEventListener('pointerleave', cancel);
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.addEventListener('click', (e) => {
      if (long){ e.preventDefault(); return; }                        // the long-press itself
      const d = b.querySelector('.del');
      if (d){ d.remove(); return; }                                   // tap chip body = dismiss delete
      clearDels();
      $('ticker').value = sym; saveState(); getPrice();
    });
  });
}
function pushRecent(sym){
  let list = loadRecents().filter(s => s !== sym);
  list.unshift(sym);
  list = list.slice(0, 8);
  try { localStorage.setItem('recent_syms', JSON.stringify(list)); } catch(e){}
  renderRecents();
}

async function getPrice(){
  const sym = $('ticker').value.trim().toUpperCase();
  if (!sym){ setQuoteHtml('<span class="err">Type a symbol first</span>'); return; }
  const btn = $('fetchBtn'); btn.disabled = true;
  setQuoteHtml('Connecting to ' + sym + '…');
  try {
    const q = await fetchQuote(sym);
    if ($('ticker').value.trim().toUpperCase() !== sym){ btn.disabled = false; return; }  // user typed a new symbol meanwhile
    const switched = sym !== liveSym;
    if (switched) prevPrice = null;
    liveSym = sym; lastUpdateAt = Date.now();
    if (switched) applyPosition(sym);   // this symbol's own entry/shares/stop — never another stock's
    setPrice(q.p, q.tag || 'LIVE');
    startStream(sym);
    runGauge(sym);                                   // Ross Cameron STRONG/MEDIUM/WEAK
    entryRhythmStart(sym);                           // pullback-zone recommendation
    pushRecent(sym);                                 // remember for one-tap circle-back
  } catch(e){
    setQuoteHtml('<span class="err">No price for ' + sym + ' — check the symbol.</span>');
  } finally {
    btn.disabled = false;                            // ALWAYS re-enable — a stuck "Go live" was the whole complaint
  }
}
// ================= Ross Cameron momentum gauge =================
// Criteria per Warrior Trading / "How to Day Trade" (verified Jul 2026):
// gain >= +10% today · RVOL >= 2 (>=5 ideal) · price $2-20 · float <= 20M (approx
// via shares outstanding — upper bound) · news catalyst within 48h.
// STRONG = core + all 3 quality; MEDIUM = core + >=1; WEAK = otherwise.
// Caps to MEDIUM: price only half-in-band ($1-2 / $20-30), float >50M, volume
// unknown (pre-market), or an offering/dilution headline (Ross red flag).
function rateStock(d){
  const reasons = [];
  const rvolKnown = d.rvol != null && isFinite(d.rvol);
  // PROVEN volume evidence (Ali 21 Jul — "volume unknown" on stocks that traded 100M+):
  //  d.sessVol = today's ACTUAL printed candle volume (incl pre/AH) ÷ 10-day full-day avg.
  //             ≥1 before the bell even rings is real heat, not a guess.
  //  d.prevX   = YESTERDAY's total ÷ 10-day avg. A stock that just did 20× average volume
  //              is a proven mover — history counts as evidence, not fabrication.
  const sessKnown = d.sessVol != null && isFinite(d.sessVol);
  const prevHot = d.prevX != null && isFinite(d.prevX) && d.prevX >= 3;
  const rvolHot = (rvolKnown && d.rvol >= 5) || (sessKnown && d.sessVol >= 5) || prevHot;
  const rvolOk  = (rvolKnown && d.rvol >= 2) || (sessKnown && d.sessVol >= 1) || prevHot;
  const volKnown = rvolKnown || sessKnown || prevHot;
  // price: $2-20 classic band; sub-$1 pennies COUNT as in-band when volume proves the build-up (Ali 17 Jul)
  const subP = d.price >= 0.10 && d.price < 2;
  const pFull = (d.price >= 2 && d.price <= 20) || (subP && rvolHot);
  const pHalf = (subP && !rvolHot) || (d.price > 20 && d.price <= 30);
  reasons.push({cls: pFull ? 'ok' : pHalf ? 'warn' : 'bad',
    t: '$' + (d.price!=null?d.price.toFixed(2):'?') + (subP ? (rvolHot ? ' penny — volume proves build-up' : ' penny — needs RVOL ≥5 to qualify') : pFull ? ' in $2–20' : pHalf ? ' edge of band' : ' out of band')});
  const gainOk = d.gain != null && d.gain >= 10;
  reasons.push({cls: gainOk ? 'ok' : 'bad', t: (d.gain!=null?(d.gain>=0?'+':'')+d.gain.toFixed(1):'?') + '% today'});
  reasons.push({cls: !volKnown ? 'warn' : rvolHot ? 'ok' : rvolOk ? 'warn' : 'bad',
    t: rvolKnown ? 'RVOL ' + d.rvol.toFixed(1) + '×'
     : sessKnown ? 'session vol ' + (d.sessVol>=10?Math.round(d.sessVol):d.sessVol.toFixed(1)) + '× 10-day avg'
     : prevHot ? 'volume proven yesterday' : 'volume unknown yet'});

  if (d.offering) reasons.push({cls:'bad', t:'⚠ OFFERING headline — dilution risk (pennies dilute MOST)'});
  // unknown volume is NOT a pass. It can no longer satisfy core; the existing
  // "volume unknown" chip plus the MEDIUM cap below still explain the downgrade.
  const core = (pFull || pHalf) && gainOk && (rvolOk || !volKnown);
  let q = 0; if (rvolHot) q++; if (fOk) q++; if (d.news) q++;
  let v = (core && q === 3) ? 'STRONG' : (core && q >= 1) ? 'MEDIUM' : 'WEAK';
  if (v === 'STRONG' && (pHalf || fBig || !volKnown || d.offering)) v = 'MEDIUM';
  if (fBig && v !== 'WEAK' && q <= 1) v = 'WEAK';

      rvol, sessVol: sessVol, prevX: st.prevX, floatM: st.soM,

// ================= SETUP badge engine (expert-designed, Jul 2026) =================
// The 4 consensus intraday momentum conditions, ALL required (5-min candles):
//   1. price > session VWAP        2. EMA9 > EMA20 (incl. pre-market seed)
//   3. price >= 99.5% of HOD       4. current 5m volume >= 1.5x avg of prior 10
// Hard gates (badge NEVER shows): market closed / first 15 min, stock red on day,
// <25 candles or <3 regular candles, or data unfetchable — absence of data is
// absence of signal. Amber "SETUP", not "BUY": conditions aligned, not advice.
function emaCalc(vals, n){
  if (vals.length < n) return null;
  let e = vals.slice(0, n).reduce((a,b) => a+b, 0) / n;
  const k = 2 / (n + 1);
  for (let i = n; i < vals.length; i++) e = vals[i] * k + e * (1 - k);
  return e;
}
function computeSetup(res, last, dp, nowSec){
  // Session-aware (Ali 17 Jul): works in PRE (from 4:15am ET) and AFTER-HOURS too.
  // VWAP + HOD anchored from the 4am pre-market start (Warrior-style); day gain computed
  // from candles vs previous close, so a stock dead in RTH but ripping extended still counts.
  try {
    if (!(last > 0)) return false;
    const ts = res.timestamp || [], q = res.indicators.quote[0];
    const ctp = res.meta.currentTradingPeriod;
    const reg0 = ctp.regular.start, reg1 = ctp.regular.end;
    const pre0 = (ctp.pre && ctp.pre.start) || reg0 - 19800;
    const post1 = (ctp.post && ctp.post.end) || reg1 + 14400;
    const now = nowSec || (Date.now() / 1000);
    if (now < pre0 + 900 || now > post1) return false;     // 15-min warmup after 4am; overnight = off
    if (now >= reg0 && now < reg0 + 900) return false;     // still skip the open's first 15 min (noise)
    const prevC = res.meta.chartPreviousClose || res.meta.previousClose || null;
    const gain = (prevC > 0) ? (last - prevC) / prevC * 100 : dp;   // sees extended moves (Finnhub dp freezes at close)
    if (gain == null || gain <= 0) return false;
    const cands = [];
    for (let i = 0; i < ts.length; i++)
      if (q.close[i] != null) cands.push({t: ts[i], h: q.high[i], l: q.low[i], c: q.close[i], v: q.volume[i] || 0});
    if (cands.length < 12) return false;                   // ~1h of prints today minimum
    let pv = 0, vv = 0;
    cands.forEach(c => { if (c.v > 0){ pv += ((c.h + c.l + c.c) / 3) * c.v; vv += c.v; } });
    if (!vv) return false;
    const vwap = pv / vv;
    const e9 = emaCalc(cands.map(c => c.c), 9), e20 = emaCalc(cands.map(c => c.c), 20);
    if (e9 == null || e20 == null) return false;
    const hod = Math.max(...cands.map(c => c.h));
    const lastC = cands[cands.length - 1];
    const elapsed = now - lastC.t;
    if (elapsed > 600) return false;                       // candles stale (cached proxy) — no signal
    let curVol;
    // projecting from <2 min of a 5-min bar inflates a single early print into a volume
    // surge; below that, judge on the last COMPLETE candle instead
    if (elapsed < 120 && cands.length >= 2) curVol = cands[cands.length - 2].v;
    else curVol = lastC.v * (300 / Math.min(Math.max(elapsed, 120), 300));
    const prior = cands.slice(-11, -1);
    if (prior.length < 5) return false;
    const avg = prior.reduce((a,c) => a + c.v, 0) / prior.length;
    if (!(avg > 0)) return false;
    return last > vwap && e9 > e20 && last >= 0.995 * hod && curVol >= 1.5 * avg;
  } catch(e){ return false; }
}

}

function calc(){

  // after ALL T212 costs (same model as the targets). Updates on every tick.
  if (!isNaN(cur) && cur > 0 && !isNaN(shares) && shares > 0){
    const cost = shares * buy * (1 + F);
    const proceeds = (shares * cur * (1 - S) - shares * T) * (1 - F);
    const pl = proceeds - cost, plPct = pl / cost * 100;
    const up = pl >= 0, sign = up ? '+' : '−';
    $('plAmt').textContent = GBPUSD ? sign + '£' + fmt(Math.abs(pl) / GBPUSD) : sign + '$' + fmt(Math.abs(pl));
    $('plPct').textContent = sign + fmt(Math.abs(plPct)) + '%';

    document.body.classList.remove('plpos');
  }
  updateTabDot();
  // (stop-loss + risk-size row removed 20 Jul — Ali cuts losses by hand; the loss advisor
  //  in the in-trade coach replaces it)
  fillCard('p5','g5','u5', buy, shares, 0.05);

}

// ================= ENTRY RHYTHM (pullback-zone recommendation — honest: a limit zone, never "buy now") =================
// ---- SECOND-LEG HEALTH: reads volume + structure, decides if a pulled-back stock can rip again ----
// Core rule (expert): don't buy the dip — buy the RECLAIM. Volume must dry up on the dip, then
// expand on a candle that closes back above VWAP. Volume is invisible to the user; it's baked in here.
function secondLegHealth(cands, vwap, last, e9){
  const n=cands.length;
  if(n<12 || !(vwap>0) || !(last>0)) return {state:'WAIT', entry:(last>0?last:(vwap>0?vwap:null)), trigger:(vwap>0?vwap:(last>0?last:null)), note:'not enough data yet'};
  const highs=cands.map(c=>c.h);
  const hod=Math.max.apply(null,highs);
  let hi=highs.lastIndexOf(hod);
  if(hi>=n-1) return {state:'HIGHS', entry:last, trigger:hod, note:'making new highs'};
  const pb=cands.slice(hi+1);
  if(pb.length<2) return {state:'HIGHS', entry:last, trigger:hod, note:'just off the high'};
  const leg=cands.slice(Math.max(0,hi-10), hi+1);
  const launch=leg.slice(-5);                              // the launch pad, not the whole run's base (bug fix)
  const legAvgV=(leg.reduce((a,c)=>a+c.v,0)/leg.length)||1;
  const pbDip=pb.length>1?pb.slice(0,-1):pb;                // exclude the reclaim bar from the dip average
  const pbAvgV=pbDip.reduce((a,c)=>a+c.v,0)/pbDip.length;
  const contraction=pbAvgV/legAvgV;
  const launchLow=Math.min.apply(null,launch.map(c=>c.l));
  const pbLow=Math.min.apply(null,pb.map(c=>c.l));
  const rise=hod-launchLow;
  const retr= rise>0 ? (hod-pbLow)/rise : 1;               // depth vs the launch, not the far base
  const higherLow= pbLow >= launchLow*0.997;
  const closesBelow=pb.filter(c=>c.c<vwap).length;
  const accepted= closesBelow>=3 && closesBelow>=pb.length*0.6;   // scales to short pullbacks
  const trigger=Math.max(vwap, pb.length>1?Math.max.apply(null,pb.slice(0,-1).map(c=>c.c)):vwap);
  const recent=cands.slice(-4,-1);
  const recentAvgV=recent.length?recent.reduce((a,c)=>a+c.v,0)/recent.length:legAvgV;
  const expansion= cands[n-1].v >= 2.0*recentAvgV;        // a real reclaim thrust, not noise
  if(retr>0.75 || !higherLow || accepted)
    return {state:'BROKEN', entry:trigger, trigger, note: !higherLow?'lower low — no bid':accepted?'living below VWAP':'gave back the move'};
  const above=last>=vwap, dried=contraction<0.6;
  if(above && dried && expansion)
    return {state:'HEALTHY', entry:last, trigger, note:'volume dried, reclaim on real volume'};
  return {state:'WAIT', entry:last, trigger, note: !dried?'volume still heavy on the dip':(!above?'still below VWAP':'reclaim not confirmed (needs volume)')};
}
function nextWalls(last, hod){
  // psychological levels a rip tends to stall at (half/whole dollars) + high-of-day. Guide, not a target.
  const out=[];
  if(last>=1){
    const half=Math.ceil(last*2)/2;                        // next .50 or whole above
    const whole=Math.ceil(last);
    out.push({v:half, t: (Math.abs(half-Math.round(half))<0.01?'whole $':'half $')});
    if(Math.abs(whole-half)>0.001) out.push({v:whole, t:'whole $'});
  } else {
    [0.5,1.0].forEach(k=>{ if(k>last) out.push({v:k, t:k===1?'whole $':'half $'}); });   // round levels first (best labels win dedup)
    const dime=Math.ceil(last*10)/10;                      // then the next dime
    out.push({v:+dime.toFixed(2), t:'dime'});
  }
  if(hod>last*1.001) out.push({v:hod, t:'HOD'});
  // nearest first, unique, keep 2-3
  const seen={}, u=out.filter(w=>w.v>last*1.001).sort((a,b)=>a.v-b.v).filter(w=>{ const k=w.v.toFixed(3); if(seen[k])return false; seen[k]=1; return true; });
  return u.slice(0,3);
}

// ================= LOSS ADVISOR (expert spec, 20 Jul) =================
// Replaces the deleted stop for LOSING trades. The old stop gave a price; a loss-freezer
// looks away from prices. This gives a VERDICT — "your reason is gone and it isn't
// recovering" — on the time channel he can't hide from, plus a WIDE magnitude floor as
// the only hard line. Advice only: the app never closes anything (Ali executes on T212).
// Anti-whipsaw: structure legs confirm on COMPLETED 1-min candles, never ticks, and the
// volume-reclaim read suppresses the smart legs so it can't scream exit at the healthy
// undercut-and-reclaim dip he trades. Only raw magnitude may jump straight to loud.
const EXIT_CFG={ timeAmberSec:180, timeRedSec:360, bufferPct:0.005,
  mae:{ std:{amber:-2.5,red:-4,getout:-6}, penny:{amber:-4,red:-7,getout:-10},
        extStd:{amber:-2,red:-3.5,getout:-5}, extPenny:{amber:-3.5,red:-6,getout:-8} } };
let ADV={sym:null,at:0,tryAt:0,vwap:null,e9:null,close:null,health:null};   // slow indicator cache (30s loop)
let _advBusy=false;
async function advisorFetch(){
  const o=ARM; if(!o||o.state!=='in'||isHold()) return;
  if(ADV.sym===o.sym && Date.now()-ADV.at<30000) return;
  // VERIFIER FIX: the throttle only existed on SUCCESS. On proxy failure the 1s coach loop
  // refired this every tick (3 parallel proxies × 8s timeouts = the same connection-pool
  // freeze class as the ZYBT halt) — precisely while he's in a losing trade. Now: one
  // in-flight at a time, and any ATTEMPT (fail included) buys a 10s cooldown.
  if(_advBusy || Date.now()-ADV.tryAt<10000) return;
  _advBusy=true; ADV.tryAt=Date.now();
  try{
    const res=await fetchCandles(o.sym,'1m'); if(!res||!ARM||ARM.sym!==o.sym) return;
    const q=res.indicators.quote[0], ts=res.timestamp||[];
    const cands=[]; for(let i=0;i<ts.length;i++) if(q.close[i]!=null) cands.push({t:ts[i],h:q.high[i],l:q.low[i],c:q.close[i],v:q.volume[i]||0});
    if(cands.length<5) return;
    // close-confirmation: judge on the last COMPLETED candle, never the forming one
    const done=(Date.now()/1000-cands[cands.length-1].t)>=60?cands[cands.length-1]:cands[cands.length-2];
    let pv=0,vv=0; cands.forEach(c=>{ if(c.v>0){ pv+=((c.h+c.l+c.c)/3)*c.v; vv+=c.v; } });
    const vwap=vv?pv/vv:null, e9=emaCalc(cands.map(c=>c.c),9);
    let health=null; try{ health=secondLegHealth(cands,vwap,done.c,e9); }catch(e){}
    // entry-structure anchor once: the lowest low of the 3 candles around the fill
    if(o.structBreak==null){
      const fillT=new Date(o.filledAt).getTime()/1000;
      const near=cands.filter(c=>Math.abs(c.t-fillT)<=180);
      if(near.length) { o.structBreak=Math.min.apply(null,near.map(c=>c.l)); armSave(); }
    }
    ADV={sym:o.sym,at:Date.now(),tryAt:Date.now(),vwap:vwap,e9:e9,close:done.c,health:health};
  }catch(e){}
  finally{ _advBusy=false; }
}
function lossAdvice(o,px,nowPct,held,ext){
  if(px==null||nowPct==null) return {level:0};
  const penny=o.fillPx<1;
  const tier=EXIT_CFG.mae[ext?(penny?'extPenny':'extStd'):(penny?'penny':'std')];
  // Leg C — magnitude floor (the only leg allowed to jump straight to loud)
  let mag=0;
  if(nowPct<=tier.getout) mag=3; else if(nowPct<=tier.red) mag=2; else if(nowPct<=tier.amber) mag=1;
  // Legs A+B need fresh indicators; without them, magnitude alone still protects
  let smart=0, driver='', reclaimed=false;
  if(ADV.sym===o.sym && Date.now()-ADV.at<90000 && ADV.vwap>0){
    const lostSpine=ADV.close<ADV.vwap && (ADV.e9==null||ADV.close<ADV.e9);
    const buffer=Math.max(o.fillPx*EXIT_CFG.bufferPct, o.fillPx<1?0.001:0.01);
    const structLost=o.structBreak!=null && ADV.close<(o.structBreak-buffer);
    reclaimed=!!(ADV.health&&ADV.health.state==='HEALTHY')&&ADV.close>ADV.vwap;
    const notWorkA=held>=EXIT_CFG.timeAmberSec && nowPct<0 && px<ADV.vwap;
    const notWorkR=held>=EXIT_CFG.timeRedSec && nowPct<0 && px<o.fillPx;
    if(lostSpine||notWorkA) smart=1;
    if((structLost&&notWorkR)||(structLost&&lostSpine)||(notWorkR&&lostSpine)) smart=2;   // RED needs TWO legs
    if(reclaimed&&mag<2) smart=0;                       // shakeout reclaimed — thesis alive
    driver= structLost?'entry low undercut and held' : lostSpine?'below VWAP + 9EMA' : notWorkR?'past the edge window, still red' : notWorkA?'3 min red below VWAP' : '';
  }
  const level=Math.max(mag,smart);
  return {level:level, driver:driver||'loss size', reclaimed:reclaimed, mag:mag};
}

      +'+5% $'+limitFor(o.fillPx,0.05).toFixed(o.fillPx<1?3:2)+' · +10% $'+limitFor(o.fillPx,0.10).toFixed(o.fillPx<1?3:2)+'</div>'
    +'<button class="btn iout'+(adv.level>=3?' iostop':takeNow?' iotake':'')+'" id="btnOut">'
      +(adv.level>=3?'&#128721; GET OUT &rarr; LOG':takeNow?'&#127919; TAKE IT &rarr; LOG':'I\'M OUT &rarr; LOG')+'</button>'
    +(px==null?'<div class="isub" style="color:var(--amber)">no live price for '+o.sym+' — type YOUR exit price:</div>'
      +'<div class="entry" style="margin-top:6px"><input id="itExit" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="exit price $" value="'+(o._itxVal||'')+'"></div>':'')
    // ALWAYS an exit that never traps: stops the coach without logging. You still log the sale
    // the normal way (entry + shares + LOG) whenever you want. This is the fix for "it hangs".
    +'<button class="btn" id="btnBack" style="width:100%;margin-top:8px;font-size:12px;opacity:.7" title="stop the timer/alarms — does NOT log; you can still LOG normally">&larr; back (stop timer · don\'t log)</button>';
  $('btnOut').onclick=exitArm;
  const itxEl=$('itExit'); if(itxEl) itxEl.oninput=()=>{ o._itxVal=itxEl.value; };   // survive the 1s re-render
  const ak=$('advAck'); if(ak) ak.onclick=()=>{ o._ackGo=1; renderInTrade(); };
  $('btnBack').onclick=()=>{ ARM=null; armSave(); renderArm(); tost('Exit coach off — log your sale the normal way when ready'); };
  if(px!=null){
    // escalation fires on level CHANGE only (alarm fatigue kills alarms); GET OUT repeats
    // until acknowledged — he's in T212 by now and only the pocket buzz reaches him there
    if(adv.level>(o._advL||0)){
      if(adv.level===2){ tost('Thesis broken — holding is choosing to lose',[60]);
        push('THESIS BROKEN — '+o.sym, 'Holding is choosing to lose'+(pl!=null?' −£'+fmt(Math.abs(pl)):'')+'. Decide your out.'); }
      if(adv.level===3){ tost('GET OUT — sell at market on T212',[100,60,100,60,100]);
        push('🛑 GET OUT — '+o.sym, 'Ride-it-down in progress'+(pl!=null?' −£'+fmt(Math.abs(pl)):'')+'. Sell at market, reassess flat.','urgent'); }
    }
    if(adv.level===3 && !o._ackGo){ if(!o._gb3||Date.now()-o._gb3>10000){ o._gb3=Date.now(); if(navigator.vibrate) navigator.vibrate([100,60,100]); } }
    // hysteresis: only a REAL recovery (back to caution/neutral) re-arms the GET OUT alarm —
    // price flicker across the tier line must not restart the buzzing he already acknowledged
    if(adv.level<=1){ o._ackGo=0; o._gb3=0; }
    o._advL=adv.level;
    if(takeNow&&!o._tb){ o._tb=1; tost(ext?'TAKE IT — no halt to save you':'TAKE IT — giving back the gain',[60,50,60,50,120]);
      push('🎯 TAKE IT — '+o.sym, 'Giving back the gain'+(pl!=null?' · still +£'+fmt(Math.abs(pl)):'')+'. Sell into strength.'); } if(used<0.8) o._tb=0;
    if(held>360&&held<363&&nowPct>=0) tost('6 min — edge window over',[60]);
  }
}

// ---- day-end takeover + streak ----
let _deShown='';
function dayStreak(){
  // must match renderPlan exactly: scalping days only, keyed on the NY trading day
  const t=loadTrades().filter(x=>x.d.slice(0,10)>=PLAN.start && x.mode!=='hold' && x.mode!=='manual');   // same start filter as renderPlan
  const days={}; t.forEach(x=>{ const k=tradeDay(x); days[k]=(days[k]||0)+x.netGBP; });
  const keys=Object.keys(days).sort();
  let eq=PLAN.eq0, streak=0;
  const goals=keys.map(k=>{ const g=days[k]>=eq*0.05-0.005; eq+=days[k]; return g; });
  for(let i=goals.length-1;i>=0;i--){ if(goals[i]) streak++; else break; }
  return streak;
}
function showDayEnd(kind, todayNet, eq){
  const id=etDayKey()+kind;
  if(_deShown===id) return; _deShown=id;
  const de=$('dayEnd');
  const tomorrow=(eq*1.05).toFixed(2);
  de.className='deover '+(kind==='goal'?'degood':'debad');
  de.innerHTML='<div class="debox"><div class="debig">'+(kind==='goal'?'🎯 DAY DONE':'STOPPED')+'</div>'
    +'<div class="denum">'+(todayNet>=0?'+':'−')+'£'+fmt(Math.abs(todayNet))+'</div>'
    +(kind==='goal'?'<div class="destreak">'+dayStreak()+' day streak at goal</div>':'<div class="destreak">−5% floor. Tomorrow resets.</div>')
    +'<div class="deplan">stop now → tomorrow\'s target £'+tomorrow+'</div>'
    +'<button class="btn deok" id="deOk">Computer OFF</button>'
    +'<button class="btn devi" id="deGo">Continue anyway (journaled)</button></div>';
  de.style.display='flex';
  $('deOk').onclick=()=>{ de.style.display='none'; };
  $('deGo').onclick=()=>{ de.style.display='none';
    DECL.push({d:new Date().toISOString(), type:'plan-deviation', kind:kind}); armSave();
    if(typeof syncJournal==='function') syncJournal();
    tost('Deviation journaled — Claude will see it.'); };
}
// hook into plan state transitions
const _origRenderPlan=renderPlan;
renderPlan=function(){
  _origRenderPlan();
  if(_planState){
    // VERIFIER FIX: must aggregate EXACTLY like the trigger — NY trading day + scalps only
    // (hold/manual excluded). The old UTC/unfiltered sum could headline "+£X" under STOPPED.
    const t=loadTrades().filter(x=>x.d.slice(0,10)>=PLAN.start);
    const today=etDayKey();
    const todayNet=t.filter(x=>tradeDay(x)===today && x.mode!=='hold' && x.mode!=='manual').reduce((a,x)=>a+x.netGBP,0);
    const eq=PLAN.eq0+t.reduce((a,x)=>a+x.netGBP,0);
    showDayEnd(_planState, todayNet, eq);
  }
};

// ---- journal sync: mirrors the LOG journal to a tiny cloud doc so Claude can read the calculator ----
const SYNC_URL='https://profit-sync-ali-default-rtdb.firebaseio.com/j/ali-q7x2mk.json';
// SAFETY (19 Jul): this used to PUT (full replace) 4s after EVERY page load. Opening the app
// on a second device, in a private tab, or after one corrupt-JSON read (loadTrades returns [])
// silently overwrote the only off-device copy with nothing. It now:
//   1. never syncs an empty journal,
//   2. reads the remote copy first and MERGES, so the mirror only ever grows,
//   3. only runs after a real log, not on page load.
function tradeKey(x){ return (x&&x.d||'')+'|'+(x&&x.sym||'')+'|'+(x&&x.entry||'')+'|'+(x&&x.exit||''); }
function mergeByKey(remote, local, keyFn){
  const out=[], seen=new Set();
  [...(Array.isArray(remote)?remote:[]), ...(Array.isArray(local)?local:[])].forEach(x=>{
    const k=keyFn(x); if(!k||seen.has(k)) return; seen.add(k); out.push(x);
  });
  out.sort((a,b)=>String(a&&a.d).localeCompare(String(b&&b.d)));
  return out;
}
async function syncJournal(){
  try{
    const local=loadTrades();
    const localDecl=(typeof DECL!=='undefined'&&Array.isArray(DECL))?DECL:[];
    if(_journalBroken) return;                                   // local copy is damaged — do not let it near the mirror
    if(!local.length && !localDecl.length) return;               // nothing to say — never wipe the mirror
    let remote=null;
    try{ remote=await jget(SYNC_URL,8000); }catch(e){ return; }  // can't read = can't merge = don't write
    const mt=mergeByKey(remote&&remote.t, local, tradeKey);
    const md=mergeByKey(remote&&remote.decl, localDecl, x=>(x&&x.d||'')+'|'+(x&&x.sym||''));
    if(remote&&Array.isArray(remote.t)&&mt.length<remote.t.length) return;   // never shrink history
    await fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({t:mt.slice(-1000), plan:PLAN, decl:md.slice(-1000), up:new Date().toISOString()})});
  }catch(e){}
}
