<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Trade Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#07090f; --card:#10141f; --field:#0b0f18; --line:#1f2738;
  --text:#eef2f9; --muted:#8b96a8; --green:#4ade80; --green2:#22c55e; --red:#f87171; --amber:#fbbf24;
}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior-y:none}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px;overscroll-behavior-y:none}
main{width:100%;max-width:460px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tickrow{display:flex;gap:8px}
.tickrow input{flex:1;text-transform:uppercase}
input[type=text],input[type=number]{background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:17px;padding:13px 14px;outline:none;width:100%}
input:focus{border-color:var(--green)}
.btn{background:#1c2436;border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;font-weight:700;padding:0 16px;cursor:pointer;min-height:50px}
.btn.primary{background:var(--green2);border:none;color:#03140a}
.btn:disabled{opacity:.5}
.bigprice{font-size:46px;font-weight:800;text-align:center;margin:12px 0 0;transition:color .2s;min-height:56px}
.bigprice.up{color:var(--green)}.bigprice.down{color:var(--red)}
.quote{font-size:13px;text-align:center;min-height:18px;color:var(--muted);margin-bottom:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--green)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.err{color:var(--red)}
.entry{display:flex;gap:8px;margin-top:6px}
.entry input{flex:1}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 5px}
.be{display:flex;justify-content:center;align-items:center;gap:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:var(--amber);border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:700;margin-top:14px;min-height:34px}
.pl{display:flex;justify-content:center;align-items:baseline;gap:12px;margin-top:12px;min-height:44px}
.pl .amt{font-size:36px;font-weight:800}
.pl .pct{font-size:18px;font-weight:800}
.pl .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.pl.up .amt,.pl.up .pct{color:var(--green)}
.pl.down .amt,.pl.down .pct{color:var(--red)}
.tcard{width:100%;border-radius:16px;padding:14px 16px;margin-top:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:12px;cursor:pointer;min-height:96px;text-align:left;color:var(--text)}
.tcard:active{transform:scale(.99)}
.tcard .pct{font-size:15px;font-weight:800;letter-spacing:.5px;min-width:82px}
.tcard .price{font-size:34px;font-weight:800;flex:1;text-align:center}
.tcard .prof{text-align:right;min-width:92px}
.tcard .prof .gbp{font-size:17px;font-weight:800}
.tcard .prof .usd{font-size:11.5px;color:var(--muted);margin-top:2px}
.tcard.t5{border-color:rgba(74,222,128,.45)}
.tcard.t5 .pct,.tcard.t5 .price,.tcard.t5 .prof .gbp{color:var(--green)}
.tcard.t10{border-color:var(--green);box-shadow:0 0 0 1px rgba(74,222,128,.25)}
.tcard.t10 .pct,.tcard.t10 .price,.tcard.t10 .prof .gbp{color:var(--green)}
.tcard .hint{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.recents{display:flex;gap:7px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.recents::-webkit-scrollbar{display:none}
.recents button{flex:none;background:var(--field);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:8px 16px;font-size:13.5px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.recents button.on{border-color:var(--green);color:var(--green)}
.ghosts{display:flex;gap:8px;margin-top:10px;justify-content:center}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer}
.ghost.on{border-color:var(--green);color:var(--green)}
.gbadge{text-align:center;font-size:20px;font-weight:900;letter-spacing:2px;border-radius:12px;padding:9px 0;margin:6px 0 6px}
.gbadge.strong{background:rgba(74,222,128,.14);color:var(--green);border:1px solid rgba(74,222,128,.5)}
.gbadge.medium{background:rgba(251,191,36,.10);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
.gbadge.weak{background:rgba(248,113,113,.10);color:var(--red);border:1px solid rgba(248,113,113,.4)}
.gbadge.loading{background:none;color:var(--muted);border:1px dashed var(--line);font-weight:700;letter-spacing:.5px;font-size:13px}
.greasons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:4px}
.greasons span{font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.greasons span.ok{color:var(--green);border-color:rgba(74,222,128,.35)}
.greasons span.bad{color:var(--red);border-color:rgba(248,113,113,.3)}
.greasons span.warn{color:var(--amber);border-color:rgba(251,191,36,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#e6f9ee;color:#0a3d1f;font-weight:800;font-size:14px;border-radius:99px;padding:10px 20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.note{color:var(--muted);font-size:11.5px;line-height:1.5;text-align:center;margin-top:16px}
a{color:var(--muted);text-decoration:none}
footer{text-align:center;margin-top:10px;font-size:12px}
</style>
</head>
<body>
<main>
<div class="tickrow">
  <input id="ticker" type="text" autocapitalize="characters" autocomplete="off" placeholder="symbol — TSLA, AAPL…">
  <button class="btn primary" id="fetchBtn">Go live</button>
</div>
<div class="recents" id="recents"></div>
<div class="bigprice mono" id="bigPrice">—</div>
<div class="quote" id="quote"></div>
<div id="gauge" hidden>
  <div class="gbadge" id="gBadge">—</div>
  <div class="greasons" id="gReasons"></div>
</div>
<input id="cur" type="hidden">

<div class="lbl">My entry price ($) · shares</div>
<div class="entry">
  <input id="avg" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="entry price">
  <input id="shares" class="mono" type="number" inputmode="decimal" step="any" min="0" placeholder="shares" style="max-width:110px">
  <button class="btn" id="grabBtn" title="stamp the live price as my entry">Use live</button>
</div>

<div class="pl mono" id="plLine" hidden>
  <span class="sub">P/L now</span><span class="amt" id="plAmt">—</span><span class="pct" id="plPct"></span>
</div>
<div class="be mono" id="beLine" hidden></div>

<button class="tcard t5" id="card5">
  <span class="pct">+5% NET</span>
  <span class="price mono" id="p5">—</span>
  <span class="prof"><div class="gbp mono" id="g5">—</div><div class="usd mono" id="u5"></div><div class="hint">tap to copy</div></span>
</button>
<button class="tcard t10" id="card10">
  <span class="pct" id="pct10">+10% NET</span>
  <span class="price mono" id="p10">—</span>
  <span class="prof"><div class="gbp mono" id="g10">—</div><div class="usd mono" id="u10"></div><div class="hint">tap to copy</div></span>
</button>
<div class="ghosts">
  <button class="ghost" data-p="10">10%</button>
  <button class="ghost" data-p="20">20%</button>
  <button class="ghost" data-p="25">25%</button>
</div>

<p class="note">These are the exact LIMIT SELL prices to place on Trading&nbsp;212 — all its real costs (0.15% FX each way + US sell fees) are already included and rounded up in your favour. NET = profit after everything.</p>
<footer><a href="/">← coin-maker3</a></footer>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// ---- Trading 212 UK Invest (GBP) real costs — verified July 2026, silent by design ----
// FX fee 0.15% each way (baked into T212's rate) · SEC 0.00278% of sell value ·
// FINRA TAF $0.000195/share sold. Commission zero. FX rate cancels for % targets:
//   P_sell = ( P_buy·(1+x)·(1+f)/(1−f) + t ) / (1−s), then round UP to the cent.
// Unit tests: buy $10.00 → +5% limit $10.54 · +10% limit $11.04 · break-even $10.04.
const F = 0.0015, S = 0.0000278, T = 0.000195;
function limitFor(buy, x){
  const raw = (buy * (1 + x) * (1 + F) / (1 - F) + T) / (1 - S);
  return Math.ceil(raw * 100 - 1e-9) / 100;
}
function breakEven(buy){ return limitFor(buy, 0); }

// ---- state persistence (per-device) ----
const FIELDS = ['ticker','avg','shares','cur'];
try {
  const saved = JSON.parse(localStorage.getItem('profit_state_v3') || '{}');
  FIELDS.forEach(id => { if (saved[id] != null && saved[id] !== '' && !$(id).value) $(id).value = saved[id]; });
} catch(e){}
function saveState(){
  try { const s = {}; FIELDS.forEach(id => s[id] = $(id).value);
        localStorage.setItem('profit_state_v3', JSON.stringify(s)); } catch(e){}
}
FIELDS.forEach(id => $(id).addEventListener('input', () => { saveState(); calc(); }));

// ---- GBP/USD for the £ profit figures (silent; falls back to $-only) ----
let GBPUSD = null;
(async () => {
  try {
    const r = await fetch('https://api.frankfurter.dev/v1/latest?base=GBP&symbols=USD');
    const j = await r.json();
    if (j && j.rates && j.rates.USD){ GBPUSD = j.rates.USD; calc(); }
  } catch(e){}
})();

// ---- live price: Finnhub quote + WebSocket stream, Yahoo/proxy fallback ----
const FINNHUB_KEY = 'd9afnh1r01qg31s4h340d9afnh1r01qg31s4h34g';
async function fetchQuote(symbol){
  try {
    const r = await fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(symbol) + '&token=' + FINNHUB_KEY);
    if (r.ok){
      const j = await r.json();
      if (j && typeof j.c === 'number' && j.c > 0) return j.c;
    }
  } catch(e){}
  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(symbol) + '?range=1d&interval=1d';
  for (const wrap of [u => u, u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)]){
    try {
      const r = await fetch(wrap(url));
      if (!r.ok) continue;
      const j = await r.json();
      const p = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
      if (p > 0) return p;
      if (j?.chart?.error) break;
    } catch(e){}
  }
  throw new Error('no price');
}

let ws = null, pollTimer = null, liveSym = null, lastTickAt = 0, prevPrice = null;
function setPrice(price, tag){
  $('cur').value = price;
  const bp = $('bigPrice');
  bp.textContent = '$' + price.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:4});
  bp.className = 'bigprice mono' + (prevPrice==null ? '' : price>prevPrice ? ' up' : price<prevPrice ? ' down' : '');
  prevPrice = price;
  $('quote').innerHTML = '<strong>' + liveSym + '</strong> <span class="live"><span class="dot"></span>' + tag + '</span>';
  saveState(); calc();
}
function stopLive(){
  if (ws){ try { ws.close(); } catch(e){} ws = null; }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
function startPolling(sym){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    try { const p = await fetchQuote(sym); if (p > 0 && sym === liveSym) setPrice(p, 'LIVE (3s)'); } catch(e){}
  }, 3000);
}
function startStream(sym){
  stopLive();
  liveSym = sym;
  try {
    ws = new WebSocket('wss://ws.finnhub.io?token=' + FINNHUB_KEY);
    ws.onopen = () => ws.send(JSON.stringify({type:'subscribe', symbol:sym}));
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'trade' && m.data && m.data.length){
          const t = m.data[m.data.length - 1];
          if (t.p > 0){ lastTickAt = Date.now(); setPrice(t.p, 'LIVE'); }
        }
      } catch(e){}
    };
    ws.onerror = () => startPolling(sym);
    ws.onclose  = () => { if (sym === liveSym && !pollTimer) startPolling(sym); };
    setTimeout(() => { if (Date.now() - lastTickAt > 8000 && sym === liveSym) startPolling(sym); }, 8000);
  } catch(e){ startPolling(sym); }
}
// ---- recent symbols: one-tap circle-back to anything searched before ----
function loadRecents(){ try { return JSON.parse(localStorage.getItem('recent_syms') || '[]'); } catch(e){ return []; } }
function renderRecents(){
  const el = $('recents');
  const list = loadRecents();
  el.innerHTML = list.map(s => '<button class="' + (s === liveSym ? 'on' : '') + '" data-s="' + s + '">' + s + '</button>').join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { $('ticker').value = b.dataset.s; saveState(); getPrice(); });
}
function pushRecent(sym){
  let list = loadRecents().filter(s => s !== sym);
  list.unshift(sym);
  list = list.slice(0, 8);
  try { localStorage.setItem('recent_syms', JSON.stringify(list)); } catch(e){}
  renderRecents();
}

async function getPrice(){
  const sym = $('ticker').value.trim().toUpperCase();
  if (!sym){ $('quote').innerHTML = '<span class="err">Type a symbol first</span>'; return; }
  const btn = $('fetchBtn'); btn.disabled = true;
  $('quote').textContent = 'Connecting to ' + sym + '…';
  try {
    const p = await fetchQuote(sym);
    if (sym !== liveSym) prevPrice = null;
    liveSym = sym;
    setPrice(p, 'LIVE');
    startStream(sym);
    runGauge(sym);                                   // Ross Cameron STRONG/MEDIUM/WEAK
    pushRecent(sym);                                 // remember for one-tap circle-back
  } catch(e){
    $('quote').innerHTML = '<span class="err">No price for ' + sym + ' — check the symbol.</span>';
  }
  btn.disabled = false;
}
// ================= Ross Cameron momentum gauge =================
// Criteria per Warrior Trading / "How to Day Trade" (verified Jul 2026):
// gain >= +10% today · RVOL >= 2 (>=5 ideal) · price $2-20 · float <= 20M (approx
// via shares outstanding — upper bound) · news catalyst within 48h.
// STRONG = core + all 3 quality; MEDIUM = core + >=1; WEAK = otherwise.
// Caps to MEDIUM: price only half-in-band ($1-2 / $20-30), float >50M, volume
// unknown (pre-market), or an offering/dilution headline (Ross red flag).
function rateStock(d){
  const reasons = [];
  const pFull = d.price >= 2 && d.price <= 20;
  const pHalf = (d.price >= 1 && d.price < 2) || (d.price > 20 && d.price <= 30);
  reasons.push({cls: pFull ? 'ok' : pHalf ? 'warn' : 'bad', t: '$' + (d.price!=null?d.price.toFixed(2):'?') + (pFull ? ' in $2–20' : pHalf ? ' edge of band' : ' out of $2–20')});
  const gainOk = d.gain != null && d.gain >= 10;
  reasons.push({cls: gainOk ? 'ok' : 'bad', t: (d.gain!=null?(d.gain>=0?'+':'')+d.gain.toFixed(1):'?') + '% today'});
  const rvolKnown = d.rvol != null && isFinite(d.rvol);
  const rvolOk = rvolKnown && d.rvol >= 2, rvolHot = rvolKnown && d.rvol >= 5;
  reasons.push({cls: !rvolKnown ? 'warn' : rvolHot ? 'ok' : rvolOk ? 'warn' : 'bad', t: rvolKnown ? 'RVOL ' + d.rvol.toFixed(1) + '×' : 'volume unknown yet'});
  const fKnown = d.floatM != null;
  const fOk = fKnown && d.floatM <= 20, fBig = fKnown && d.floatM > 50;
  reasons.push({cls: !fKnown ? 'warn' : fOk ? 'ok' : fBig ? 'bad' : 'warn', t: fKnown ? '~' + Math.round(d.floatM) + 'M shares (approx float)' : 'float unknown'});
  reasons.push({cls: d.news ? 'ok' : 'bad', t: d.news ? 'news ' + d.newsAge : 'no fresh news'});
  if (d.offering) reasons.push({cls:'bad', t:'⚠ OFFERING headline — dilution risk'});
  const core = (pFull || pHalf) && gainOk && (rvolOk || !rvolKnown);
  let q = 0; if (rvolHot) q++; if (fOk) q++; if (d.news) q++;
  let v = (core && q === 3) ? 'STRONG' : (core && q >= 1) ? 'MEDIUM' : 'WEAK';
  if (v === 'STRONG' && (pHalf || fBig || !rvolKnown || d.offering)) v = 'MEDIUM';
  if (fBig && v !== 'WEAK' && q <= 1) v = 'WEAK';
  return {verdict: v, reasons};
}
try { window.rateStock = rateStock; } catch(e){}

async function jget(url, ms){
  const ctl = new AbortController();
  const t = ms ? setTimeout(() => ctl.abort(), ms) : null;
  try {
    const r = await fetch(url, {signal: ctl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally { if (t) clearTimeout(t); }
}
// today's volume via Yahoo — race two proxies, 8s cap, null if both fail (rating stays honest)
async function todayVolume(sym){
  const y = 'https://query1.finance.yahoo.com/v8/finance/chart/' + sym + '?range=1d&interval=1d';
  const wraps = ['https://api.allorigins.win/raw?url=', 'https://corsproxy.io/?url='];
  const tries = wraps.map(w => jget(w + encodeURIComponent(y), 8000)
    .then(j => { const v = j?.chart?.result?.[0]?.meta?.regularMarketVolume; if (v > 0) return v; throw 0; }));
  try { return await Promise.any(tries); } catch(e){ return null; }
}
const GCACHE_KEY = 'gauge_' + new Date().toISOString().slice(0,10);
async function runGauge(sym){
  const box = $('gauge'), badge = $('gBadge'), rs = $('gReasons');
  box.hidden = false; badge.className = 'gbadge loading'; badge.textContent = 'rating ' + sym + '…'; rs.innerHTML = '';
  try {
    let cache = {};
    try { cache = JSON.parse(localStorage.getItem(GCACHE_KEY) || '{}'); } catch(e){}
    let st = cache[sym];
    if (!st){
      const [met, prof] = await Promise.all([
        jget('https://finnhub.io/api/v1/stock/metric?symbol=' + sym + '&metric=all&token=' + FINNHUB_KEY).catch(()=>null),
        jget('https://finnhub.io/api/v1/stock/profile2?symbol=' + sym + '&token=' + FINNHUB_KEY).catch(()=>null)]);
      st = { avgM: met?.metric?.['10DayAverageTradingVolume'] ?? null,   // millions
             soM: prof?.shareOutstanding ?? null };                       // millions
      cache[sym] = st;
      try { localStorage.setItem(GCACHE_KEY, JSON.stringify(cache)); } catch(e){}
    }
    const to = new Date(), fr = new Date(Date.now() - 2*864e5);
    const dstr = d => d.toISOString().slice(0,10);
    const [q, news, vol] = await Promise.all([
      jget('https://finnhub.io/api/v1/quote?symbol=' + sym + '&token=' + FINNHUB_KEY, 8000).catch(()=>null),
      jget('https://finnhub.io/api/v1/company-news?symbol=' + sym + '&from=' + dstr(fr) + '&to=' + dstr(to) + '&token=' + FINNHUB_KEY, 8000).catch(()=>[]),
      todayVolume(sym)]);
    if (sym !== liveSym) return;                      // user moved on — drop stale rating
    const rvol = (vol && st.avgM) ? vol / (st.avgM * 1e6) : null;
    const fresh = (news || []).filter(n => n.datetime * 1000 >= Date.now() - 48*3600e3);
    const newest = fresh.length ? Math.max(...fresh.map(n => n.datetime * 1000)) : null;
    const ageH = newest ? Math.max(0, Math.round((Date.now() - newest) / 3600e3)) : null;
    const r = rateStock({
      price: (q && q.c > 0) ? q.c : (parseFloat($('cur').value) || null),
      gain: q?.dp ?? null,
      rvol, floatM: st.soM,
      news: fresh.length > 0,
      newsAge: ageH != null ? (ageH === 0 ? 'just now' : ageH + 'h ago') : '',
      offering: fresh.some(n => /offering|pricing of|dilut/i.test(n.headline || ''))
    });
    badge.className = 'gbadge ' + r.verdict.toLowerCase();
    badge.textContent = r.verdict;
    rs.innerHTML = r.reasons.map(x => '<span class="' + x.cls + '">' + x.t + '</span>').join('');
  } catch(e){
    badge.className = 'gbadge loading'; badge.textContent = 'rating unavailable';
  }
}

$('fetchBtn').addEventListener('click', getPrice);
$('ticker').addEventListener('keydown', e => { if (e.key === 'Enter') getPrice(); });
$('grabBtn').addEventListener('click', () => {
  const v = parseFloat($('cur').value);
  if (v > 0){ $('avg').value = v; saveState(); calc(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && liveSym) startStream(liveSym); });
window.addEventListener('load', () => { renderRecents(); if ($('ticker').value.trim()) getPrice(); });

// ---- second card target (10% default; ghosts swap to 20/25) ----
let alt = 10;
document.querySelectorAll('.ghost').forEach(g => g.addEventListener('click', () => {
  document.querySelectorAll('.ghost').forEach(x => x.classList.remove('on'));
  g.classList.add('on');
  alt = parseFloat(g.dataset.p);
  $('pct10').textContent = '+' + alt + '% NET';
  calc();
}));
document.querySelector('.ghost[data-p="10"]').classList.add('on');

function fmt(n, dp=2){ return n.toLocaleString('en-US',{minimumFractionDigits:dp, maximumFractionDigits:dp}); }

function fillCard(pEl, gEl, uEl, buy, shares, x){
  $(pEl).textContent = '$' + fmt(limitFor(buy, x));
  const profUSD = (!isNaN(shares) && shares > 0) ? x * shares * buy * (1 + F) : null;
  if (profUSD != null){
    if (GBPUSD){ $(gEl).textContent = '+£' + fmt(profUSD / GBPUSD); $(uEl).textContent = '+$' + fmt(profUSD); }
    else { $(gEl).textContent = '+$' + fmt(profUSD); $(uEl).textContent = ''; }
  } else { $(gEl).textContent = '—'; $(uEl).textContent = ''; }
}

function calc(){
  const buy = parseFloat($('avg').value);
  const shares = parseFloat($('shares').value);
  if (isNaN(buy) || buy <= 0){
    $('beLine').hidden = true;
    $('p5').textContent = '—'; $('g5').textContent = '—'; $('u5').textContent = '';
    $('p10').textContent = '—'; $('g10').textContent = '—'; $('u10').textContent = '';
    return;
  }
  const be = breakEven(buy);
  const cur = parseFloat($('cur').value);
  let beTxt = 'Flat at $' + fmt(be);
  if (!isNaN(cur) && cur > 0) beTxt += (cur >= be ? '  ·  you are UP' : '  ·  below break-even');
  $('beLine').textContent = beTxt;
  $('beLine').hidden = false;
  // live P/L NOW — what he truly walks away with if he sold at the live price,
  // after ALL T212 costs (same model as the targets). Updates on every tick.
  if (!isNaN(cur) && cur > 0 && !isNaN(shares) && shares > 0){
    const cost = shares * buy * (1 + F);
    const proceeds = (shares * cur * (1 - S) - shares * T) * (1 - F);
    const pl = proceeds - cost, plPct = pl / cost * 100;
    const up = pl >= 0, sign = up ? '+' : '−';
    $('plAmt').textContent = GBPUSD ? sign + '£' + fmt(Math.abs(pl) / GBPUSD) : sign + '$' + fmt(Math.abs(pl));
    $('plPct').textContent = sign + fmt(Math.abs(plPct)) + '%';
    const el = $('plLine'); el.className = 'pl mono ' + (up ? 'up' : 'down'); el.hidden = false;
  } else {
    $('plLine').hidden = true;
  }
  fillCard('p5','g5','u5', buy, shares, 0.05);
  fillCard('p10','g10','u10', buy, shares, alt/100);
}

// tap a card = copy its limit price (kills transcription errors into T212)
function copyCard(priceId){
  const t = $(priceId).textContent.replace('$','');
  if (!t || t === '—') return;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => {
    const toast = $('toast');
    toast.textContent = t + ' copied — paste into your T212 limit order';
    toast.classList.add('show');
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(() => toast.classList.remove('show'), 1800);
  }).catch(()=>{});
}
$('card5').addEventListener('click', () => copyCard('p5'));
$('card10').addEventListener('click', () => copyCard('p10'));

calc();
</script>
