<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>UGI Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* World: the endoscopy monitor. Black field, one bright circular image, NBI cyan. Dark-first because the scene is a phone at night. */
:root{--bg:#0a0e13;--panel:#131a22;--panel-2:#1a232d;--ink:#eef3f6;--ink-2:#9fb0bd;--line:#273440;--cyan:#3fd0e4;--cyan-ink:#06161a;--good:#4fd68e;--bad:#ff6f6f;--amber:#f4b54a;--mucosa:#e9607a;--display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef1f3;--panel:#ffffff;--panel-2:#f3f6f8;--ink:#121a21;--ink-2:#55656f;--line:#d6dde3;--cyan:#0d8ea3;--cyan-ink:#ffffff;--good:#1f9a5a;--bad:#d64545;--amber:#b7791f;--mucosa:#c93d5b;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef1f3;--panel:#ffffff;--panel-2:#f3f6f8;--ink:#121a21;--ink-2:#55656f;--line:#d6dde3;--cyan:#0d8ea3;--cyan-ink:#ffffff;--good:#1f9a5a;--bad:#d64545;--amber:#b7791f;--mucosa:#c93d5b;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:var(--cyan);color:var(--cyan-ink)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-block:env(safe-area-inset-top,0px) 32px;padding-inline:16px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:2.3rem;font-weight:800;line-height:1.05}
h2{font-size:1.25rem;font-weight:700}
.sub{color:var(--ink-2);margin:6px 0 0}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.lens{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#ffd4dc 0,var(--mucosa) 45%,#5a1626 100%);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 3px #000}
.stat{display:flex;gap:18px;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1}
.stat span{color:var(--ink-2);font-size:.8rem;margin-top:4px}
.decks{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.deck{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s cubic-bezier(.2,.8,.2,1),border-color .15s}
.deck:hover{transform:translateY(-1px);border-color:var(--cyan)}
.deck:active{transform:scale(.99)}
.deck svg{width:28px;height:28px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;justify-self:center}
.deck .n{font-family:var(--display);font-weight:700;font-size:1.05rem}
.deck .d{color:var(--ink-2);font-size:.85rem;margin-top:2px}
.deck .best{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--ink-2);text-align:right;min-width:0}
.deck .best b{display:block;color:var(--ink);font-family:var(--display);font-size:1.1rem}
.foot{margin-top:auto;padding-top:18px;color:var(--ink-2);font-size:.82rem}
.foot a{color:var(--cyan)}
/* play */
.bar{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.bar button.x{background:transparent;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.bar button.x svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.prog{flex:1;height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--cyan);transition:width .25s cubic-bezier(.2,.8,.2,1)}
.streak{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--amber);min-width:52px;text-align:right}
.streak.off{color:var(--ink-2);font-weight:500}
.timer{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem;min-width:52px;text-align:right}
.timer.low{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.q{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.25;letter-spacing:-.01em}
.scene{color:var(--ink-2);margin:8px 0 0;font-size:.95rem}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;line-height:1.3;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--cyan)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel-2))}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--panel-2);font-size:.95rem}
.why b{font-family:var(--display)}
.why.good{box-shadow:inset 0 0 0 1px var(--good)}
.why.bad{box-shadow:inset 0 0 0 1px var(--bad)}
.next{margin-top:14px;width:100%;background:var(--cyan);color:var(--cyan-ink);border:0;border-radius:12px;padding:13px;font-family:var(--display);font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 6px 16px rgba(63,208,228,.25)}
.next:hover{filter:brightness(1.06)}
/* result */
.score{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;letter-spacing:-.03em;margin-top:18px;font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--ink-2);font-weight:600;letter-spacing:0}
.verdict{margin-top:6px;color:var(--ink-2)}
.missed{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.missed div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.missed div b{display:block;font-family:var(--display);margin-bottom:2px}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;border-radius:12px;padding:13px;font-family:var(--display);font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel)}
.row button.pri{background:var(--cyan);color:var(--cyan-ink);border-color:transparent}
.hint{color:var(--ink-2);font-size:.85rem;margin-top:10px}

.pic{display:block;width:100%;max-height:44vh;object-fit:contain;border-radius:12px;background:#000;margin:4px 0 12px}
.weak{margin-top:22px}
.weak h2{margin-bottom:8px}
.wd{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.wd div{display:flex;gap:8px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem}
.wd b{font-family:var(--display);font-variant-numeric:tabular-nums}
.wd b.g{color:var(--good)}.wd b.a{color:var(--amber)}.wd b.b{color:var(--bad)}
.wq{display:flex;flex-direction:column;gap:8px}
.wq div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.wq div b{display:block;font-family:var(--display);margin-bottom:2px}
.coach{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--panel-2);font-size:.95rem}
.copy{margin-top:10px;width:100%;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:12px;font-family:var(--display);font-weight:600;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--cyan);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.card{animation:none}.deck,.prog i{transition:none}}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section class="screen on" id="home">
  <div class="top">
    <div><h1>UGI Trainer</h1><p class="sub">Leicester course, 8 and 9 October. One question at a time.</p></div>
    <div class="lens" aria-hidden="true"></div>
  </div>
  <div class="stat"><div><b id="sAnswered">0</b><span>answered</span></div><div><b id="sAcc">–</b><span>accuracy</span></div><div><b id="sBestStreak">0</b><span>best streak</span></div></div>
  <div class="decks" id="decks"></div>
  <div class="weak" id="weak"></div>
  <p class="foot">Quiz-slide diagnoses are my reads of the images, not the course key. Full notes: <a href="guide/">the reading version</a>.</p>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="bar">
    <button class="x" id="quit" aria-label="Back to home"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="prog"><i id="progFill"></i></div>
    <div class="streak off" id="streak">0</div>
    <div class="timer" id="timer" hidden>60</div>
  </div>
  <div class="card" id="card"></div>
</section>

<!-- RESULT -->
<section class="screen" id="result">
  <div class="bar"><button class="x" id="quit2" aria-label="Back to home"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h2 id="rTitle">Round done</h2></div>
  <div class="score" id="rScore">0<small> / 10</small></div>
  <div class="verdict" id="rVerdict"></div>
  <div class="missed" id="rMissed"></div>
  <div class="coach" id="rCoach"></div>
  <div class="row"><button id="again" class="pri">Play again</button><button id="homeBtn">Decks</button></div>
  <button class="copy" id="copyBtn" type="button">Copy report for Claude</button><p class="hint" id="copyHint" hidden>Copied. Paste it into the chat and I will adjust the decks.</p>
</section>

</div>

<script>
(function(){
"use strict";
// ---------- content ----------
// Each item: q, [scene], o (options), c (index of correct), w (why). Short by design.
var BANK={
drugs:[
 {q:"Diagnostic OGD with biopsies. On clopidogrel after a stroke.",o:["Stop clopidogrel 7 days before","Continue clopidogrel, take the biopsies","Switch to aspirin for 5 days","Scope but take no biopsies"],c:1,w:"Diagnostic procedures with biopsy are low risk. P2Y12 drugs continue. BSG/ESGE 2021."},
 {q:"Diagnostic OGD. Warfarin for AF, INR 2.4.",o:["Stop warfarin 5 days before","Bridge with LMWH","Continue, check the INR was not above range in the last week","Give vitamin K the night before"],c:2,w:"Low-risk procedure: warfarin continues. Only an INR above range needs a dose adjustment."},
 {q:"Oesophageal dilatation planned. Warfarin for lone AF, no stroke history.",o:["Continue warfarin","Stop 5 days before, INR under 1.5, no bridging","Stop 5 days before and bridge with LMWH","Stop 2 days before"],c:1,w:"High-risk procedure, low thrombotic risk: stop 5 days, INR under 1.5, restart the same evening."},
 {q:"PEG insertion. Warfarin for a mechanical mitral valve.",o:["Continue warfarin","Stop 5 days, no bridging","Stop warfarin and bridge with LMWH","Switch to apixaban for the week"],c:2,w:"Mechanical mitral valve is high thrombotic risk: stop warfarin and bridge with LMWH."},
 {q:"Apixaban, normal kidneys. Booked for EMR (high risk).",o:["Omit only the morning dose","Last dose at least 48 hours before, no bridging","Stop 7 days before","Bridge with LMWH"],c:1,w:"DOACs: last dose at least 48 hours before a high-risk procedure. Never bridge a DOAC."},
 {q:"Dabigatran, creatinine clearance 40. Polypectomy planned.",o:["48 hours off","72 hours off","7 days off","No need to stop"],c:1,w:"Dabigatran is renally cleared: with CrCl 30 to 50, stop 72 hours before a high-risk procedure."},
 {q:"Rivaroxaban. Diagnostic OGD with biopsies tomorrow morning.",o:["Omit the morning dose on the day","Stop 48 hours before","Stop 7 days before","Nothing changes"],c:0,w:"Low-risk procedure on a DOAC: omit the morning dose on the day."},
 {q:"Dual antiplatelets, drug-eluting coronary stent 3 months ago. Elective high-risk procedure requested.",o:["Stop both for 7 days","Defer; if it cannot wait, keep aspirin and discuss the P2Y12 drug with cardiology","Stop aspirin, keep clopidogrel","Proceed on both"],c:1,w:"P2Y12 can only be stopped after 12 months for a drug-eluting stent (1 month bare metal). Always via the cardiologist."},
 {q:"Aspirin 75 mg alone. Any endoscopy, diagnostic or therapeutic.",o:["Stop 7 days before","Stop 3 days before","Continue","Replace with clopidogrel"],c:2,w:"Aspirin continues for all procedures. The guideline's only named exception is ampullectomy."},
 {q:"Ticagrelor after an ACS 2 years ago, no stent. High-risk procedure.",o:["Continue ticagrelor","Stop 7 days before","Stop 2 days before","Bridge with LMWH"],c:1,w:"Low thrombotic risk now: stop the P2Y12 drug 7 days before a high-risk procedure."},
 {q:"Warfarin stopped 5 days ago for a high-risk procedure. INR today 1.8.",o:["Proceed","Give vitamin K and proceed","Postpone or give low-dose oral vitamin K and recheck","Bridge with heparin"],c:2,w:"The target is INR under 1.5 on the day. 1.8 is not safe for a high-risk procedure."},
 {q:"VTE 6 weeks ago on warfarin. Needs a high-risk procedure now.",o:["Stop warfarin, no bridging","Stop warfarin and bridge with LMWH","Continue warfarin","Switch to aspirin"],c:1,w:"VTE within 3 months is high thrombotic risk: bridge with LMWH if the procedure cannot wait."},
 {q:"After a high-risk procedure, when does warfarin restart?",o:["The same evening","After 7 days","After 1 month","Never, switch to a DOAC"],c:0,w:"Restart warfarin the evening of the procedure; it takes days to become therapeutic."},
 {q:"After a high-risk procedure, when does a DOAC restart?",o:["Same evening","2 to 3 days later if haemostasis is secure","7 days later","Next morning always"],c:1,w:"DOACs act within hours, so restart 2 to 3 days after a high-risk procedure once haemostasis is secure."},
 {q:"Unstable upper GI bleed on warfarin, INR 3.5.",o:["Wait for the INR to fall below 1.5","Reverse with prothrombin complex concentrate plus vitamin K and scope","Give FFP only","Scope only after 5 days"],c:1,w:"Reverse with PCC and vitamin K. Do not delay endoscopy for the INR."},
 {q:"Bleeding on dabigatran, haemodynamically unstable. Which reversal agent?",o:["Vitamin K","Protamine","Idarucizumab","Tranexamic acid"],c:2,w:"Idarucizumab reverses dabigatran. Andexanet is for the factor Xa drugs where available."},
 {q:"Case 1 on the course: 68-year-old, IBD, aspirin after a TIA. Flexi sig with a biopsy series.",o:["Go ahead but no biopsies","Take all the biopsies needed","Stop aspirin 7 days first","Cancel"],c:1,w:"Aspirin is safe for diagnostic and therapeutic endoscopy. Over 20,000 polypectomies showed no extra bleeding."},
 {q:"Case 2 on the course: 71-year-old on clopidogrel, weak coeliac serology, D2 biopsies.",o:["Stop clopidogrel 7 days","Biopsy anyway on clopidogrel","Switch to aspirin","Do serology again instead"],c:1,w:"Diagnostic procedures including multiple biopsies are safe on clopidogrel. Four from D2 plus bulb biopsies."},
 {q:"Case 3 on the course: 65-year-old, weight loss, AF on warfarin INR 2.4. Biopsy any ulcer?",o:["Yes, go ahead on warfarin","No, stop warfarin first","Start heparin first","Only if INR under 1.5"],c:0,w:"Diagnostic OGD with biopsy is low risk; warfarin continues. Biopsy the ulcer."},
 {q:"What must every patient be told before you change anything?",o:["The cost of the drugs","The thrombotic risk of stopping and the bleeding risk of continuing","That the doctor decides","That biopsies are never taken on anticoagulants"],c:1,w:"A strong recommendation in the guideline: explain both risks, every time."}
],
spot:[
 {img:"p02",q:"Dozens of small smooth sessile polyps across the gastric body. Long-term PPI.",o:["Fundic gland polyps","Hyperplastic polyps","Adenomas","Linitis plastica"],c:0,w:"Fundic gland polyps from PPI use. Biopsy one or two; do not clear them. Innumerable in a young patient: think FAP."},
 {img:"p03",q:"Salmon-pink tongues extending above the gastro-oesophageal junction, incidental.",o:["Barrett's oesophagus","Candidiasis","Reflux oesophagitis","Inlet patch"],c:0,w:"Barrett's. Report Prague C and M from the top of the gastric folds, Seattle biopsies, surveillance by length."},
 {img:"p04",q:"Longstanding heartburn. Mucosal breaks in the distal oesophagus.",o:["Eosinophilic oesophagitis","Reflux oesophagitis, grade it LA A to D","Varices","Achalasia"],c:1,w:"LA classification. PPI 8 weeks. LA C or D gets a repeat scope after healing to look for Barrett's underneath."},
 {img:"p05",q:"Young man, food bolus. After clearing it: concentric rings and furrows.",o:["Schatzki ring","Eosinophilic oesophagitis","Peptic stricture","Carcinoma"],c:1,w:"EoE. Six biopsies, proximal and distal. Always biopsy after a bolus."},
 {img:"p06",q:"Pain on swallowing. White adherent plaques.",o:["Oesophageal candidiasis","Barrett's","Glycogenic acanthosis","Leukoplakia"],c:0,w:"Candida. Odynophagia means mucosal disease. Fluconazole; ask why: inhalers, immunosuppression, diabetes."},
 {img:"p07",q:"Weight loss and dyspepsia. Irregular ulcerated lesion at the cardia on retroflexion.",o:["Hiatus hernia","Gastric cancer at the cardia","Cameron erosions","Fundal varices"],c:1,w:"Cardia tumour, seen only in retroflexion. Six to eight edge biopsies, staging CT, MDT."},
 {img:"p18",q:"Ulcer with a raised pigmented protuberance, no active bleeding.",o:["Forrest Ia","Forrest IIa, visible vessel","Forrest IIc","Forrest III"],c:1,w:"Non-bleeding visible vessel: high rebleed risk, dual endoscopic therapy, high-dose PPI."},
 {img:"p08",q:"Adherent clot on an ulcer base. What first?",o:["Leave it alone","Wash and irrigate to reveal what is beneath, then treat","Inject adrenaline only","Biopsy the clot"],c:1,w:"Clear the view, classify with Forrest, treat with two modalities. Adrenaline alone is never enough."},
 {img:"p10",q:"Progressive dysphagia to solids then liquids, weight loss. Friable mass narrowing the lumen.",o:["Oesophageal carcinoma","Achalasia","Peptic stricture","Web"],c:0,w:"Malignancy until proven otherwise. Distance from incisors and length, multiple biopsies, CT then PET and EUS."},
 {img:"p11",q:"Bluish tortuous columns in the distal oesophagus.",o:["Biopsy to confirm","Varices: grade, look for red signs, never biopsy","Dilate","Argon plasma coagulation"],c:1,w:"Never biopsy a bluish submucosal bump. Banding programme or beta-blocker; terlipressin and antibiotics if bleeding."},
 {img:"p12",q:"Dysphagia and heartburn. Smooth short narrowing at the GOJ.",o:["Peptic stricture","Carcinoma","Achalasia","EoE"],c:0,w:"Smooth and short is benign. Biopsy, dilate, long-term PPI. Irregular or long: think cancer."},
 {img:"p13",q:"Smooth gastric bulge with normal overlying mucosa. CT shows a wall mass.",o:["Standard biopsies","Submucosal tumour, likely GIST: EUS with FNA","Polypectomy","Nothing, reassure"],c:1,w:"Normal mucosa over a lump is submucosal. Standard biopsies miss it; EUS tells you the wall layer and size."},
 {img:"p14",q:"Non-progressive dysphagia for years. Thin membrane, small central lumen.",o:["Web or benign stricture: dilate","Carcinoma","Varices","Candida"],c:0,w:"Fixed benign narrowing. Dilate. An upper web: check ferritin (Plummer-Vinson)."},
 {img:"p15",q:"Intermittent meat bolus in an otherwise well patient. Thin ring at the squamocolumnar junction.",o:["Schatzki ring","Carcinoma","EoE","Zenker's"],c:0,w:"Schatzki ring, symptomatic under about 13 mm. One large-diameter dilatation, PPI."},
 {img:"p16",q:"Lumpy smooth swellings in the fundus on retroflexion.",o:["Biopsy them","Fundal varices: do not biopsy, look for portal hypertension","Fundic gland polyps","Remove with a snare"],c:1,w:"Gastric varices. Check for liver disease or splenic vein thrombosis before you reach for forceps."},
 {img:"p17",q:"Iron deficiency anaemia. Scalloped, flattened duodenal folds.",o:["Normal variant","Coeliac disease","Crohn's","Giardia"],c:1,w:"Coeliac. Four D2 biopsies plus one or two from the bulb, on a gluten-containing diet, tTG-IgA."},
 {q:"OGD for iron deficiency anaemia. Duodenum looks normal.",o:["No biopsies needed","Take D2 biopsies anyway","Biopsy the antrum only","Refer for capsule"],c:1,w:"Always biopsy D2 in IDA. Coeliac can look normal."},
 {q:"Nocturnal epigastric pain relieved by food.",o:["Gastric ulcer","Duodenal ulcer pattern","Pancreatitis","Reflux"],c:1,w:"Classic duodenal ulcer story. Test and treat H. pylori."},
 {img:"p19",q:"Dyspepsia. Erythema and small antral erosions.",o:["Erosive gastritis: H. pylori biopsies, stop NSAIDs, PPI","Gastric cancer","GAVE","Menetrier's"],c:0,w:"Erosive gastritis. Under-55s without alarm features should have had test-and-treat first."},
 {img:"p20",q:"Multiple red stripes radiating to the pylorus in the antrum.",o:["Portal hypertensive gastropathy","GAVE (watermelon stomach)","Erosive gastritis","Dieulafoy"],c:1,w:"GAVE is antral stripes or spots. PHG is a fundus and body mosaic. GAVE causes chronic iron deficiency; APC treats it."},
 {q:"Snake-skin mosaic pattern in the fundus and body of a cirrhotic.",o:["GAVE","Portal hypertensive gastropathy","Candidiasis","Gastric varices"],c:1,w:"PHG. Mosaic, proximal stomach. Treat the portal pressure, not the mucosa."},
 {img:"p21",q:"Large lobulated ulcerated gastric mass. What goes in the report?",o:["Just the diagnosis","Site, size, shape, whether it bleeds, biopsies taken","The patient's age","Nothing until histology"],c:1,w:"The report drives staging and the MDT. Describe it fully and biopsy generously."},
 {img:"p23",q:"Small antral nodule with a central dimple on the greater curve.",o:["GIST","Pancreatic rest (ectopic pancreas)","Carcinoid","Lipoma"],c:1,w:"The central umbilication is the opening of a rudimentary duct. Benign, incidental, leave it."},
 {img:"p24",q:"Heavy smoker and drinker. Subtle flat patch in the mid-oesophagus. Best next step?",o:["Ignore","Lugol's iodine or NBI, target the unstained area","Dilate","Random biopsies only"],c:1,w:"Lugol's stains normal squamous mucosa; dysplasia stays unstained. Target biopsies there."},
 {img:"p09",q:"Confluent ulceration with slough in the distal oesophagus.",o:["Severe erosive oesophagitis, LA C or D","Barrett's","Candida","Achalasia"],c:0,w:"Biopsy anything irregular or heaped up; high-dose PPI 8 weeks; repeat scope after healing to look underneath."},
 {img:"p22",q:"Same gastric lesion under narrow-band imaging. What does NBI add?",o:["Nothing, it is cosmetic","Surface and vessel pattern to characterise it and target biopsies","It replaces biopsy","It measures depth of invasion"],c:1,w:"Irregular surface and vessel pattern supports neoplasia. Biopsy the most abnormal area."},
 {img:"p25",q:"Same oesophagus after Lugol's iodine. The pale unstained patch is?",o:["Normal mucosa","Squamous dysplasia or early cancer: target biopsies there","Candida","Barrett's"],c:1,w:"Lugol's stains normal squamous mucosa brown; dysplasia stays unstained. Refer for endoscopic resection if confirmed."},

var DECKS=[
 {id:"drugs",name:"Blood thinners",desc:"The BSG/ESGE 2021 grid. The session you can win.",n:10,icon:"<svg viewBox='0 0 24 24'><path d='M12 3v18M5 8h14M7 16h10'/></svg>"},
 {id:"spot",name:"Spot diagnosis",desc:"Dr Kadri's quiz cases, said in four beats.",n:10,icon:"<svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='8'/><circle cx='12' cy='12' r='3'/></svg>"},
 {id:"consent",name:"Consent and indications",desc:"Who gets a scope, who can say yes.",n:10,icon:"<svg viewBox='0 0 24 24'><path d='M6 4h9l4 4v12H6z'/><path d='M9 13l2 2 4-4'/></svg>"},
 {id:"safety",name:"Sedation, antibiotics, unit",desc:"Prep, prophylaxis, diathermy, GRS, cleaning.",n:10,icon:"<svg viewBox='0 0 24 24'><path d='M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z'/></svg>"},

// ---------- state ----------
var S={deck:null,items:[],i:0,right:0,streak:0,missed:[],timer:null,left:60,locked:false};
var $=function(s){return document.querySelector(s)};
function store(k,v){try{localStorage.setItem("ugi2_"+k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{var v=localStorage.getItem("ugi2_"+k);return v?JSON.parse(v):d}catch(e){return d}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function shuffleOpts(it){var idx=it.o.map(function(_,k){return k});idx=shuffle(idx);return{q:it.q,img:it.img,scene:it.scene,deck:it.deck,o:idx.map(function(k){return it.o[k]}),c:idx.indexOf(it.c),w:it.w}}
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.toggle("on",s.id===id)});window.scrollTo(0,0)}
// ---------- home ----------
function renderHome(){
  renderWeak();
  var tot=load("tot",{a:0,r:0,bs:0});
  $("#sAnswered").textContent=tot.a;$("#sAcc").textContent=tot.a?Math.round(100*tot.r/tot.a)+"%":"–";$("#sBestStreak").textContent=tot.bs;
  var host=$("#decks");host.innerHTML="";
  DECKS.forEach(function(d){
    var best=load("best_"+d.id,null);
    var b=document.createElement("button");b.className="deck";b.type="button";b.id="deck_"+d.id;
    b.innerHTML=d.icon+"<div><div class='n'>"+d.name+"</div><div class='d'>"+d.desc+"</div></div><div class='best'>"+(best!==null?"best<b>"+best+(d.timed?"":" / "+Math.min(d.n,BANK[d.id]?BANK[d.id].length:d.n))+"</b>":"<b>play</b>")+"</div>";
    b.addEventListener("click",function(){start(d)});host.appendChild(b);
  });
}
// ---------- play ----------
function start(d){
  S.deck=d;S.i=0;S.right=0;S.streak=0;S.missed=[];S.locked=false;
  var pool;
  if(d.id==="rapid"){pool=[];Object.keys(BANK).forEach(function(k){BANK[k].forEach(function(it){var c=Object.assign({},it);c.deck=k;pool.push(c)})});S.items=shuffle(pool).map(shuffleOpts)}
  else if(d.ordered){S.items=BANK[d.id].map(function(it){var c=Object.assign({},it);c.deck=d.id;return shuffleOpts(c)})}
  else{S.items=shuffle(BANK[d.id]).slice(0,d.n).map(function(it){var c=Object.assign({},it);c.deck=d.id;return shuffleOpts(c)})}
  $("#timer").hidden=!d.timed;$("#streak").hidden=!!d.timed;
  if(d.timed){S.left=60;$("#timer").textContent="60";$("#timer").classList.remove("low");clearInterval(S.timer);S.timer=setInterval(tick,1000)}
  show("play");renderQ();
}
function tick(){S.left--;$("#timer").textContent=S.left;if(S.left<=10)$("#timer").classList.add("low");if(S.left<=0){clearInterval(S.timer);finish()}}
function renderQ(){
  var it=S.items[S.i];if(!it){finish();return}
  var total=S.deck.timed?null:S.items.length;
  $("#progFill").style.width=total?(100*S.i/total)+"%":(100*Math.min(1,(60-S.left)/60))+"%";
  var st=$("#streak");st.textContent=S.streak>1?S.streak+"×":S.streak;st.classList.toggle("off",S.streak<2);
  var label=S.deck.timed?deckName(it.deck):(S.deck.ordered?"Step "+(S.i+1)+" of "+total:(S.i+1)+" of "+total);
  var h="<div class='tag'>"+label+"</div>"+(it.img?"<img class='pic' src='img/"+it.img+".jpg' alt='Endoscopy image for this case' loading='lazy'>":"")+"<div class='q'>"+esc(it.q)+"</div>"+(it.scene?"<p class='scene'>"+esc(it.scene)+"</p>":"")+"<div class='opts'>";
  it.o.forEach(function(o,k){h+="<button type='button' class='opt' data-k='"+k+"' id='opt"+k+"'>"+esc(o)+"</button>"});
  h+="</div><div id='why'></div>";
  var card=$("#card");card.innerHTML=h;card.style.animation="none";void card.offsetWidth;card.style.animation="";
  S.locked=false;
  card.querySelectorAll(".opt").forEach(function(b){b.addEventListener("click",function(){answer(+b.dataset.k)})});
}
function deckName(id){for(var i=0;i<DECKS.length;i++)if(DECKS[i].id===id)return DECKS[i].name;return""}
function answer(k){
  if(S.locked)return;S.locked=true;
  var it=S.items[S.i];var ok=k===it.c;
  var tot=load("tot",{a:0,r:0,bs:0});tot.a++;if(ok){tot.r++;S.right++;S.streak++;if(S.streak>tot.bs)tot.bs=S.streak}else{S.streak=0;S.missed.push(it)}
  store("tot",tot);
  var qs=load("qs",{});var key=(it.deck||S.deck.id)+"|"+it.q;var e=qs[key]||{a:0,r:0,w:it.w,o:it.o[it.c]};e.a++;if(ok)e.r++;qs[key]=e;store("qs",qs);
  document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;var kk=+b.dataset.k;if(kk===it.c)b.classList.add("right");else if(kk===k)b.classList.add("wrong")});
  var st=$("#streak");st.textContent=S.streak>1?S.streak+"×":S.streak;st.classList.toggle("off",S.streak<2);
  var why=$("#why");why.innerHTML="<div class='why "+(ok?"good":"bad")+"'><b>"+(ok?"Right.":"Not this one.")+"</b> "+esc(it.w)+"</div><button type='button' class='next' id='nextBtn'>"+(S.i+1<S.items.length&&!S.deck.timed?"Next":(S.deck.timed?"Next":"See score"))+"</button>";
  $("#nextBtn").addEventListener("click",function(){S.i++;if(S.deck.timed&&S.i>=S.items.length){finish();return}renderQ()});
  if(S.deck.timed){setTimeout(function(){if(S.locked&&S.items[S.i]===it){S.i++;renderQ()}},1600)}
}
function finish(){
  clearInterval(S.timer);
  var n=S.deck.timed?S.i:S.items.length;var sc=S.right;
  var best=load("best_"+S.deck.id,null);if(best===null||sc>best){store("best_"+S.deck.id,sc);best=sc}
  $("#rTitle").textContent=S.deck.name;
  $("#rScore").innerHTML=sc+"<small> / "+n+"</small>";
  var pct=n?sc/n:0;
  $("#rVerdict").textContent=S.deck.timed?(sc+" correct in 60 seconds. Best "+best+"."):(pct===1?"Clean round. That is the standard for tomorrow.":pct>=.8?"Strong. Fix the misses below and go again.":pct>=.6?"Getting there. Read the misses, then replay.":"Replay this deck tonight. The misses are the whole point.");
  var m=$("#rMissed");m.innerHTML="";S.missed.forEach(function(it){var d=document.createElement("div");d.innerHTML="<b>"+esc(it.q)+"</b>"+esc(it.o[it.c])+". "+esc(it.w);m.appendChild(d)});
  var w=weakSpots();var worst=Object.keys(w.byDeck).filter(function(d){return w.byDeck[d].a>=5}).sort(function(a,b){return w.byDeck[a].r/w.byDeck[a].a-w.byDeck[b].r/w.byDeck[b].a})[0];$("#rCoach").textContent=worst?"Weakest deck so far: "+deckName(worst)+" at "+Math.round(100*w.byDeck[worst].r/w.byDeck[worst].a)+"%. Play that one next.":"Play two more decks and the trainer will tell you where you are weakest.";$("#copyHint").hidden=true;
  show("result");renderHome();
}

function weakSpots(){
  var qs=load("qs",{});var byDeck={};var rows=[];
  Object.keys(qs).forEach(function(k){var e=qs[k];var d=k.split("|")[0];byDeck[d]=byDeck[d]||{a:0,r:0};byDeck[d].a+=e.a;byDeck[d].r+=e.r;if(e.a-e.r>0)rows.push({k:k,d:d,q:k.slice(d.length+1),e:e})});
  rows.sort(function(x,y){return ((y.e.a-y.e.r)/y.e.a)-((x.e.a-x.e.r)/x.e.a)||(y.e.a-y.e.r)-(x.e.a-x.e.r)});
  return{byDeck:byDeck,rows:rows};
}
function renderWeak(){
  var w=weakSpots();var host=$("#weak");if(!host)return;
  var decks=Object.keys(w.byDeck).filter(function(d){return w.byDeck[d].a>=3}).map(function(d){return{d:d,p:Math.round(100*w.byDeck[d].r/w.byDeck[d].a),a:w.byDeck[d].a}}).sort(function(x,y){return x.p-y.p});
  if(!decks.length&&!w.rows.length){host.innerHTML="";return}
  var h="<h2>Your weak spots</h2>";
  if(decks.length){h+="<div class='wd'>";decks.forEach(function(x){h+="<div><span>"+esc(deckName(x.d))+"</span><b class='"+(x.p>=80?"g":x.p>=60?"a":"b")+"'>"+x.p+"%</b></div>"});h+="</div>"}
  if(w.rows.length){h+="<div class='wq'>";w.rows.slice(0,5).forEach(function(r){h+="<div><b>"+esc(r.q)+"</b>"+esc(r.e.o)+". "+esc(r.e.w)+"</div>"});h+="</div>"}
  host.innerHTML=h;
}
function report(){
  var w=weakSpots();var tot=load("tot",{a:0,r:0,bs:0});
  var lines=["UGI Trainer report "+new Date().toISOString().slice(0,16).replace("T"," "),"Overall: "+tot.r+"/"+tot.a+" correct, best streak "+tot.bs];
  if(S.deck)lines.push("Last round: "+S.deck.name+" "+S.right+"/"+(S.deck.timed?S.i:S.items.length));
  Object.keys(w.byDeck).forEach(function(d){lines.push("- "+deckName(d)+": "+w.byDeck[d].r+"/"+w.byDeck[d].a)});
  if(w.rows.length){lines.push("Most missed:");w.rows.slice(0,10).forEach(function(r){lines.push("- ["+deckName(r.d)+"] "+r.q+" (missed "+(r.e.a-r.e.r)+" of "+r.e.a+")")})}
  if(S.missed.length){lines.push("Missed this round:");S.missed.forEach(function(it){lines.push("- "+it.q)})}
  return lines.join("\n");
}
function fallbackCopy(t){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
$("#quit").addEventListener("click",function(){clearInterval(S.timer);renderHome();show("home")});
